        var d = new Date(isoStr);
        if (isNaN(d.getTime())) return '';
        var mins = Math.max(1, Math.floor((Date.now() - d.getTime()) / 60000));
        if (mins < 60) return currentLang === 'zh' ? (mins + '分钟前') : (mins + 'm ago');
        var hrs = Math.floor(mins / 60);
        if (hrs < 24) return currentLang === 'zh' ? (hrs + '小时前') : (hrs + 'h ago');
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      }

      function getCatLabel(catId) {
        var t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
        for (var i = 0; i < t.categories.length; i++) {

      function translateSingleText(text, targetLangCode) {
        var clean = String(text || '').trim();
        if (!clean) return Promise.resolve('');
        var cacheKey = targetLangCode + '::' + clean;
        if (translationCache[cacheKey]) {
          return Promise.resolve(translationCache[cacheKey]);
        }

        // 分段避免超长文本触发接口长度限制
        var chunks = [];
        var maxLen = 420;
        for (var i = 0; i < clean.length; i += maxLen) {
          chunks.push(clean.slice(i, i + maxLen));
        }

        return Promise.all(chunks.map(function (chunk) {
          var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' +
            encodeURIComponent(targetLangCode) + '&dt=t&q=' + encodeURIComponent(chunk);
          return fetch(url)
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .then(function (data) {
              if (!Array.isArray(data) || !Array.isArray(data[0])) {
                throw new Error('Bad payload');
              }
              return data[0].map(function (seg) { return seg && seg[0] ? seg[0] : ''; }).join('');
            });
        })).then(function (parts) {
          var merged = parts.join('');
          translationCache[cacheKey] = merged;
          return merged;
        });
      }

      function checkPostRisk(title, content) {
        var t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
        var lastTs = 0;
        try { lastTs = Number(localStorage.getItem('dmjt_last_post_ts') || '0'); } catch (e) {}
        if (Date.now() - lastTs < 20000) {
          return t.cooldownMsg;
        }
        var blob = (title + ' ' + content).toLowerCase();
        for (var i = 0; i < BLOCK_WORDS.length; i++) {
          if (blob.indexOf(BLOCK_WORDS[i]) !== -1) {
            return t.blockedMsg;
          }
        }
        return '';
      }

      function getMergedPosts() {
        var approvedIds = {};
        for (var i = 0; i < approvedPosts.length; i++) {
          approvedIds[approvedPosts[i].id] = true;
        }
        var activePending = [];
        for (var j = 0; j < myPendingPosts.length; j++) {
          if (!approvedIds[myPendingPosts[j].id]) {
            activePending.push(myPendingPosts[j]);
          }
        }
        if (activePending.length !== myPendingPosts.length) {
          myPendingPosts = activePending;
          try { localStorage.setItem(MY_PENDING_KEY, JSON.stringify(myPendingPosts)); } catch (e) {}
        }
        return myPendingPosts.concat(approvedPosts);
      }

          .select('id,category,author_name,title,content,likes,reply_count,created_at,status')

          .limit(60)
          .then(function (res) {

              showStatus('云端读取提示：' + res.error.message + '（已展示本地内容）');

              approvedPosts = res.data.length > 0 ? res.data : SEED_POSTS.slice();

      function submitNewPost() {
        var t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
        var catEl = document.getElementById('postCategoryInput');
        var authorEl = document.getElementById('postAuthorInput');
        var titleEl = document.getElementById('postTitleInput');
        var contentEl = document.getElementById('postContentInput');

        var category = catEl && catEl.value ? catEl.value : 'chat';
        var authorRaw = authorEl && authorEl.value ? authorEl.value.trim() : '';
        var title = titleEl && titleEl.value ? titleEl.value.trim() : '';
        var content = contentEl && contentEl.value ? contentEl.value.trim() : '';

        if (!title || !content) {
          alert(t.alertMissing);
          return;
        }

        var riskErr = checkPostRisk(title, content);
        if (riskErr) {
          alert(riskErr);
          return;
        }

        var authorName = authorRaw || t.defaultAuthor;
        try {
          if (authorRaw) localStorage.setItem('dmjt_forum_nick', authorRaw);
          localStorage.setItem('dmjt_last_post_ts', String(Date.now()));
        } catch (e) {}

        var tempPost = {
          id: Date.now(),
          category: category,
          author_name: authorName,
          title: title,
          content: content,
          likes: 0,
          reply_count: 0,
          status: 'pending',
          created_at: new Date().toISOString()
        };

        myPendingPosts.unshift(tempPost);
        try { localStorage.setItem(MY_PENDING_KEY, JSON.stringify(myPendingPosts)); } catch (e) {}

        if (titleEl) titleEl.value = '';
        if (contentEl) contentEl.value = '';
        closeNewPostModal();
        showStatus(t.pendingSubmitted);
        renderPostsList();

        if (sb) {
          sb.from('forum_posts')
            .insert([{ category: category, author_name: authorName, title: title, content: content, status: 'pending' }])
            .select()
            .single()
            .then(function (res) {
              if (res && res.error) {
                showStatus('发帖同步失败：' + res.error.message);
                return;
              }
              if (res && res.data) {
                for (var j = 0; j < myPendingPosts.length; j++) {
                  if (myPendingPosts[j].id === tempPost.id) myPendingPosts[j] = res.data;
                }
                try { localStorage.setItem(MY_PENDING_KEY, JSON.stringify(myPendingPosts)); } catch (e) {}
                renderPostsList();
              }
            });
        }
      }

        var authorName = authorRaw || t.defaultAuthor;
        try {
          if (authorRaw) localStorage.setItem('dmjt_forum_nick', authorRaw);
          localStorage.setItem('dmjt_last_post_ts', String(Date.now()));
        } catch (e) {}
        if (contentEl) contentEl.value = '';

        if (activePost.isSeed || activePost.status === 'pending' || !sb) {
          alert('该帖子正在审核中或为演示话题，待审核通过公开后即可盖楼回复！');
          return;
        }

        var targetPost = activePost;
        sb.from('forum_replies')
          .insert([{ post_id: targetPost.id, author_name: authorName, content: content }])
          .then(function (res) {
            if (res && res.error) {
              alert('回复失败：' + res.error.message);
              return;
            }
            var nextCount = (targetPost.reply_count || 0) + 1;
            targetPost.reply_count = nextCount;
            sb.from('forum_posts').update({ reply_count: nextCount }).eq('id', targetPost.id).then(function () {});
            loadReplies(targetPost.id);
            renderPostsList();
          });
      }

      function likeCurrentPost() {
        if (!activePost) return;
        var nextLikes = (activePost.likes || 0) + 1;
        activePost.likes = nextLikes;
        setText('detailLikeBtn', '❤️ ' + nextLikes);
        renderPostsList();

        if (!activePost.isSeed && activePost.status === 'approved' && sb) {
          sb.from('forum_posts').update({ likes: nextLikes }).eq('id', activePost.id).then(function () {});
        }
      }

      var bZh = document.getElementById('fLang-zh');
      var bEn = document.getElementById('fLang-en');
      var bMs = document.getElementById('fLang-ms');
      if (bZh) bZh.addEventListener('click', function () { switchForumLang('zh'); });
      if (bEn) bEn.addEventListener('click', function () { switchForumLang('en'); });
      if (bMs) bMs.addEventListener('click', function () { switchForumLang('ms'); });

      var searchInput = document.getElementById('forumSearchInput');
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(renderPostsList, 120);
        });
      }

      var topPostBtn = document.getElementById('topNewPostBtn');
      var botPostBtn = document.getElementById('bottomNewPostBtn');
      var closePostBtn = document.getElementById('closeNewPostBtn');
      var submitPostBtn = document.getElementById('submitPostBtn');
      var detailTransBtn = document.getElementById('detailTranslateBtn');
      var closeDetailBtn = document.getElementById('closeDetailBtn');
      var likeBtn = document.getElementById('detailLikeBtn');
      var sendReplyBtn = document.getElementById('sendReplyBtn');

      if (topPostBtn) topPostBtn.addEventListener('click', openNewPostModal);
      if (botPostBtn) botPostBtn.addEventListener('click', openNewPostModal);
      if (closePostBtn) closePostBtn.addEventListener('click', closeNewPostModal);
      if (submitPostBtn) submitPostBtn.addEventListener('click', submitNewPost);
      if (detailTransBtn) detailTransBtn.addEventListener('click', toggleDetailTranslation);
      if (closeDetailBtn) closeDetailBtn.addEventListener('click', closeDetailModal);
      if (likeBtn) likeBtn.addEventListener('click', likeCurrentPost);
      if (sendReplyBtn) sendReplyBtn.addEventListener('click', submitReply);

      switchForumLang(currentLang);
      loadPosts();
    });
  </script>
</body>
</html>
