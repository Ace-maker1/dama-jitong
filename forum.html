    function setText(id, val) {
      const el = document.getElementById(id);
      if (el) el.innerText = val;
    }

    function setPlaceholder(id, val) {
      const el = document.getElementById(id);
      if (el) el.placeholder = val;

    function showStatus(msg) {
      const bar = document.getElementById('forumStatusBar');
      if (!bar) return;
      if (!msg) {
        bar.classList.add('hidden');
        bar.innerText = '';
      } else {
        bar.classList.remove('hidden');
        bar.innerText = msg;
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"')
        .replace(/'/g, ''');
    }

    function timeAgo(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      const mins = Math.max(1, Math.floor((Date.now() - d.getTime()) / 60000));
      if (mins < 60) return currentLang === 'zh' ? `${mins}分钟前` : `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return currentLang === 'zh' ? `${hrs}小时前` : `${hrs}h ago`;
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

      setText('pageSub', t.sub);

      setText('navHome', t.navHome);
      setText('navNews', t.navNews);
      setText('navPost', t.navPost);
      setText('nav4d', t.nav4d);
      setText('navBiz', t.navBiz);

      setPlaceholder('replyContentInput', t.replyPh);

      renderPostsList();

        const prevVal = sel.value;
        sel.innerHTML = t.categories.filter(c => c.id !== 'all').map(c =>
          `<option value="${c.id}">${c.label}</option>`
        ).join('');
        if (prevVal) sel.value = prevVal;
      }
    }

    async function loadPosts() {
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
        allPosts = Array.isArray(cached) && cached.length > 0 ? cached : [...SEED_POSTS];
      } catch (e) {
        allPosts = [...SEED_POSTS];
      }
      renderPostsList();

      if (!sb) return;
      const syncTag = document.getElementById('syncTag');
      if (syncTag) syncTag.classList.remove('hidden');

      try {
        const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 6000));
        const queryPromise = sb
          .from('forum_posts')
          .select('id,category,author_name,title,content,likes,reply_count,created_at')
          .order('created_at', { ascending: false })
          .limit(60);

        const { data, error } = await Promise.race([queryPromise, timeoutPromise]);
        if (error) {
          console.error('Supabase loadPosts error:', error);
          showStatus(`云端读取提示：${error.message}（已展示本地内容）`);
        } else if (Array.isArray(data)) {
          showStatus('');
          allPosts = data.length > 0 ? data : [...SEED_POSTS];
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(allPosts)); } catch (e) {}
          renderPostsList();
        }
      } catch (e) {
        console.warn('loadPosts timeout/error:', e);
      } finally {
        if (syncTag) syncTag.classList.add('hidden');
      }
    }

    function renderPostsList() {
      const t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
      const box = document.getElementById('postsContainer');
      if (!box) return;

      const kw = (document.getElementById('forumSearchInput')?.value || '').trim().toLowerCase();
      const filtered = allPosts.filter(p => {
        const matchCat = currentCat === 'all' || p.category === currentCat;
        const matchKw = !kw || (p.title || '').toLowerCase().includes(kw) || (p.content || '').toLowerCase().includes(kw);
        return matchCat && matchKw;
      });

      if (filtered.length === 0) {
        box.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center space-y-3 border border-gray-100">
            <div class="text-3xl">💬</div>
            <p class="text-xs text-gray-500 font-medium">${t.emptyPosts}</p>
            <button type="button" onclick="openNewPostModal()" class="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-full cursor-pointer">${t.topPost}</button>
          </div>
        `;
        return;
      }

      box.innerHTML = filtered.map(p => `
        <div onclick="openPostDetail(${p.id})"
             class="bg-white rounded-2xl p-3.5 shadow-2xs border border-gray-100 hover:border-indigo-200 transition cursor-pointer">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span class="bg-indigo-50 text-indigo-700 text-[10px] font-black px-2 py-0.5 rounded-full">${escapeHtml(getCatLabel(p.category))}</span>
            <span class="text-[11px] text-gray-400">${escapeHtml(p.author_name)} · ${timeAgo(p.created_at)}</span>
          </div>
          <h2 class="font-bold text-gray-900 text-[15px] leading-snug mb-1">${escapeHtml(p.title)}</h2>
          <p class="text-xs text-gray-500 line-clamp-2 mb-2.5 leading-relaxed">${escapeHtml(p.content)}</p>
          <div class="flex items-center justify-between text-[11px] text-gray-400 pt-2 border-t border-gray-50">
            <div class="flex items-center gap-3">
              <span>❤️ ${p.likes || 0}</span>
              <span>💬 ${p.reply_count || 0}</span>
            </div>
            <span class="text-indigo-600 font-bold">${t.viewThread}</span>
          </div>
        </div>
      `).join('');
    }

    function openNewPostModal() {
      const authorEl = document.getElementById('postAuthorInput');
      if (authorEl) {
        try { authorEl.value = localStorage.getItem('dmjt_forum_nick') || ''; } catch (e) {}
      }
      const catEl = document.getElementById('postCategoryInput');
      if (catEl && currentCat !== 'all') {
        catEl.value = currentCat;
      }
      document.getElementById('newPostModal')?.classList.remove('hidden');
    }

    function closeNewPostModal() {
      document.getElementById('newPostModal')?.classList.add('hidden');
    }

    async function submitNewPost() {
      const t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
      const category = document.getElementById('postCategoryInput')?.value || 'chat';
      const authorRaw = (document.getElementById('postAuthorInput')?.value || '').trim();
      const title = (document.getElementById('postTitleInput')?.value || '').trim();
      const content = (document.getElementById('postContentInput')?.value || '').trim();

      if (!title || !content) {
        alert(t.alertMissing);
        return;
      }

      const author_name = authorRaw || t.defaultAuthor;
      try { if (authorRaw) localStorage.setItem('dmjt_forum_nick', authorRaw); } catch (e) {}

      const tempPost = {
        id: Date.now(),
        category,
        author_name,
        title,
        content,
        likes: 0,
        reply_count: 0,
        created_at: new Date().toISOString()
      };

      allPosts = [tempPost, ...allPosts.filter(p => !p.isSeed)];
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(allPosts)); } catch (e) {}

      document.getElementById('postTitleInput').value = '';
      document.getElementById('postContentInput').value = '';
      closeNewPostModal();
      renderPostsList();

      if (sb) {
        const { data, error } = await sb
          .from('forum_posts')
          .insert([{ category, author_name, title, content }])
          .select()
          .single();

        if (error) {
          console.error('Supabase insert error:', error);
          showStatus(`发帖同步失败（已暂存本地）：${error.message}`);
        } else if (data) {
          showStatus('');
          allPosts = allPosts.map(p => (p.id === tempPost.id ? data : p));
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(allPosts)); } catch (e) {}
          renderPostsList();
        }
      }
    }

    async function openPostDetail(postId) {
      const post = allPosts.find(p => p.id === postId);
      if (!post) return;
      activePost = post;

      try {
        document.getElementById('replyAuthorInput').value = localStorage.getItem('dmjt_forum_nick') || '';
      } catch (e) {}

      setText('detailCatBadge', getCatLabel(post.category));
      setText('detailTitle', post.title);
      setText('detailMeta', `${post.author_name} · ${timeAgo(post.created_at)}`);
      setText('detailLikeBtn', `❤️ ${post.likes || 0}`);
      setText('detailContent', post.content);

      document.getElementById('detailModal')?.classList.remove('hidden');
      await loadReplies(post.id);
    }

    function closeDetailModal() {
      document.getElementById('detailModal')?.classList.add('hidden');
      activePost = null;
    }

    async function loadReplies(postId) {
      const t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
      const listEl = document.getElementById('repliesList');
      if (!listEl) return;

      if (!sb || postId < 0) {
        const demoReplies = postId === -1
          ? [{ author_name: '吉隆坡阿杰', content: '报道！支持大马本地吹水站越做越好 👍', created_at: new Date().toISOString() }]
          : [];
        setText('repliesHeader', t.repliesHeader(demoReplies.length));
        listEl.innerHTML = demoReplies.length === 0
          ? `<p class="text-xs text-gray-400 text-center py-4">${t.noReplies}</p>`
          : demoReplies.map((r, idx) => `
              <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-100">
                <div class="flex items-center justify-between text-[10px] text-slate-400 mb-1">
                  <span class="font-bold text-slate-700">#${idx + 1} ${escapeHtml(r.author_name)}</span>
                  <span>${timeAgo(r.created_at)}</span>
                </div>
                <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-wrap">${escapeHtml(r.content)}</p>
              </div>
            `).join('');
        return;
      }

      const { data } = await sb
        .from('forum_replies')
        .select('id,author_name,content,created_at')
        .eq('post_id', postId)
        .order('created_at', { ascending: true });

      const replies = Array.isArray(data) ? data : [];
      setText('repliesHeader', t.repliesHeader(replies.length));

      if (replies.length === 0) {
        listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">${t.noReplies}</p>`;
        return;
      }

      listEl.innerHTML = replies.map((r, idx) => `
        <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-100">
          <div class="flex items-center justify-between text-[10px] text-slate-400 mb-1">
            <span class="font-bold text-slate-700">#${idx + 1} ${escapeHtml(r.author_name)}</span>
            <span>${timeAgo(r.created_at)}</span>
          </div>
          <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-wrap">${escapeHtml(r.content)}</p>
        </div>
      `).join('');
    }

    async function submitReply() {
      if (!activePost) return;
      const t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
      const authorRaw = (document.getElementById('replyAuthorInput')?.value || '').trim();
      const content = (document.getElementById('replyContentInput')?.value || '').trim();
      if (!content) return;

      const author_name = authorRaw || t.defaultAuthor;
      try { if (authorRaw) localStorage.setItem('dmjt_forum_nick', authorRaw); } catch (e) {}
      document.getElementById('replyContentInput').value = '';

      if (activePost.isSeed || !sb) {
        alert('请先点击右上角「✏️ 发帖」发布一条真实话题后再进行盖楼回复！');
        return;
      }

      const { error } = await sb.from('forum_replies').insert([{
        post_id: activePost.id,
        author_name,
        content
      }]);

      if (error) {
        alert(`回复失败：${error.message}`);
        return;
      }

      const newCount = (activePost.reply_count || 0) + 1;
      activePost.reply_count = newCount;
      await sb.from('forum_posts').update({ reply_count: newCount }).eq('id', activePost.id);

      await loadReplies(activePost.id);
      renderPostsList();
    }

    async function likeCurrentPost() {
      if (!activePost) return;
      const nextLikes = (activePost.likes || 0) + 1;
      activePost.likes = nextLikes;
      setText('detailLikeBtn', `❤️ ${nextLikes}`);
      renderPostsList();

      if (!activePost.isSeed && sb) {
        await sb.from('forum_posts').update({ likes: nextLikes }).eq('id', activePost.id);
      }
    }

    switchForumLang(currentLang);
    loadPosts();
  </script>
</body>
</html>
