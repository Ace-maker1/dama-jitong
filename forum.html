      function showStatus(msg) {

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&')
          .replace(/</g, '<')
          .replace(/>/g, '>')
          .replace(/"/g, '"')
          .replace(/'/g, ''');
      }

      function timeAgo(isoStr) {
        if (!isoStr) return '';
        var d = new Date(isoStr);
        if (isNaN(d.getTime())) return '';
        var mins = Math.max(1, Math.floor((Date.now() - d.getTime()) / 60000));
        if (mins < 60) return currentLang === 'zh' ? (mins + '分钟前') : (mins + 'm ago');
        var hrs = Math.floor(mins / 60);
        if (hrs < 24) return currentLang === 'zh' ? (hrs + '小时前') : (hrs + 'h ago');
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      }

      function getCatLabel(catId) {

        }
        return t.categories[1].label;
      }

      function renderCategoryTabs() {
        var t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
        var tabsEl = document.getElementById('categoryTabs');
        if (tabsEl) {
          var html = '';
          for (var i = 0; i < t.categories.length; i++) {
            var c = t.categories[i];
            var active = c.id === currentCat;
            html += '<button type="button" data-cat="' + c.id + '" class="forum-cat-btn px-3 py-1 rounded-full text-xs font-bold shrink-0 cursor-pointer transition ' +
              (active ? 'bg-white text-indigo-800 shadow-xs' : 'bg-black/20 text-white/90 hover:bg-black/30') +
              '">' + escapeHtml(c.label) + '</button>';
          }
          tabsEl.innerHTML = html;

          var catBtns = tabsEl.querySelectorAll('.forum-cat-btn');
          for (var j = 0; j < catBtns.length; j++) {
            catBtns[j].addEventListener('click', function () {
              currentCat = this.getAttribute('data-cat') || 'all';
              renderCategoryTabs();
              renderPostsList();
            });
          }
        }

        var sel = document.getElementById('postCategoryInput');
        if (sel) {
          var prevVal = sel.value;
          var opts = '';
          for (var k = 0; k < t.categories.length; k++) {
            if (t.categories[k].id !== 'all') {
              opts += '<option value="' + t.categories[k].id + '">' + escapeHtml(t.categories[k].label) + '</option>';
            }
          }
          sel.innerHTML = opts;
          if (prevVal) sel.value = prevVal;
        }
      }

        setText('lblPostTitle', t.lblPostTitle);
        setPlaceholder('postTitleInput', t.titlePh);
        setText('lblPostContent', t.lblPostContent);
        setPlaceholder('postContentInput', t.contentPh);
        setText('submitPostBtn', t.submitBtn);
        setPlaceholder('replyContentInput', t.replyPh);
        setText('sendReplyBtn', t.sendReply);

        renderCategoryTabs();
        renderPostsList();
      }

      function renderPostsList() {
        var t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
        var box = document.getElementById('postsContainer');
        if (!box) return;

        var searchEl = document.getElementById('forumSearchInput');
        var kw = (searchEl && searchEl.value ? searchEl.value : '').trim().toLowerCase();

        var filtered = [];
        for (var i = 0; i < allPosts.length; i++) {
          var p = allPosts[i];
          var matchCat = currentCat === 'all' || p.category === currentCat;
          var textBlob = ((p.title || '') + ' ' + (p.content || '')).toLowerCase();
          var matchKw = !kw || textBlob.indexOf(kw) !== -1;
          if (matchCat && matchKw) filtered.push(p);
        }

        if (filtered.length === 0) {
          box.innerHTML = '<div class="bg-white rounded-2xl p-8 text-center space-y-3 border border-gray-100">' +
            '<div class="text-3xl">💬</div>' +
            '<p class="text-xs text-gray-500 font-medium">' + escapeHtml(t.emptyPosts) + '</p>' +
            '<button type="button" id="emptyNewPostBtn" class="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-full cursor-pointer">' + escapeHtml(t.topPost) + '</button>' +
            '</div>';
          var emptyBtn = document.getElementById('emptyNewPostBtn');
          if (emptyBtn) emptyBtn.addEventListener('click', openNewPostModal);
          return;
        }

        var listHtml = '';
        for (var j = 0; j < filtered.length; j++) {
          var item = filtered[j];
          listHtml += '<div data-post-id="' + item.id + '" class="forum-post-card bg-white rounded-2xl p-3.5 shadow-2xs border border-gray-100 hover:border-indigo-200 transition cursor-pointer">' +
            '<div class="flex items-center justify-between gap-2 mb-1.5">' +
            '<span class="bg-indigo-50 text-indigo-700 text-[10px] font-black px-2 py-0.5 rounded-full">' + escapeHtml(getCatLabel(item.category)) + '</span>' +
            '<span class="text-[11px] text-gray-400">' + escapeHtml(item.author_name) + ' · ' + escapeHtml(timeAgo(item.created_at)) + '</span>' +
            '</div>' +
            '<h2 class="font-bold text-gray-900 text-[15px] leading-snug mb-1">' + escapeHtml(item.title) + '</h2>' +
            '<p class="text-xs text-gray-500 line-clamp-2 mb-2.5 leading-relaxed">' + escapeHtml(item.content) + '</p>' +
            '<div class="flex items-center justify-between text-[11px] text-gray-400 pt-2 border-t border-gray-50">' +
            '<div class="flex items-center gap-3"><span>❤️ ' + (item.likes || 0) + '</span><span>💬 ' + (item.reply_count || 0) + '</span></div>' +
            '<span class="text-indigo-600 font-bold">' + escapeHtml(t.viewThread) + '</span>' +
            '</div>' +
            '</div>';
        }
        box.innerHTML = listHtml;

        var cards = box.querySelectorAll('.forum-post-card');
        for (var k = 0; k < cards.length; k++) {
          cards[k].addEventListener('click', function () {
            var pid = Number(this.getAttribute('data-post-id'));
            openPostDetail(pid);
          });
        }
      }

      function loadPosts() {
        try {
          var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
          allPosts = Array.isArray(cached) && cached.length > 0 ? cached : SEED_POSTS.slice();
        } catch (e) {
          allPosts = SEED_POSTS.slice();
        }
        renderPostsList();

        if (!sb) return;
        var syncTag = document.getElementById('syncTag');
        if (syncTag) syncTag.classList.remove('hidden');

        sb.from('forum_posts')
          .select('id,category,author_name,title,content,likes,reply_count,created_at')
          .order('created_at', { ascending: false })
          .limit(60)
          .then(function (res) {
            if (syncTag) syncTag.classList.add('hidden');
            if (res && res.error) {
              showStatus('云端读取提示：' + res.error.message + '（已展示本地内容）');
              return;
            }
            if (res && Array.isArray(res.data)) {
              showStatus('');
              allPosts = res.data.length > 0 ? res.data : SEED_POSTS.slice();
              try { localStorage.setItem(CACHE_KEY, JSON.stringify(allPosts)); } catch (e) {}
              renderPostsList();
            }
          })
          .catch(function () {
            if (syncTag) syncTag.classList.add('hidden');
          });
      }

      function openNewPostModal() {
        var authorEl = document.getElementById('postAuthorInput');
        if (authorEl) {
          try { authorEl.value = localStorage.getItem('dmjt_forum_nick') || ''; } catch (e) {}
        }
        var catEl = document.getElementById('postCategoryInput');
        if (catEl && currentCat !== 'all') catEl.value = currentCat;
        var modal = document.getElementById('newPostModal');
        if (modal) modal.classList.remove('hidden');
      }

      function closeNewPostModal() {
        var modal = document.getElementById('newPostModal');
        if (modal) modal.classList.add('hidden');
      }

      function submitNewPost() {
        var t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
        var catEl = document.getElementById('postCategoryInput');
        var authorEl = document.getElementById('postAuthorInput');
        var titleEl = document.getElementById('postTitleInput');
        var contentEl = document.getElementById('postContentInput');

        var category = catEl && catEl.value ? catEl.value : 'chat';
        var authorRaw = authorEl && authorEl.value ? authorEl.value.trim() : '';
        var title = titleEl && titleEl.value ? titleEl.value.trim() : '';
        var content = contentEl && contentEl.value ? contentEl.value.trim() : '';

        if (!title || !content) {
          alert(t.alertMissing);
          return;
        }

        var authorName = authorRaw || t.defaultAuthor;
        try { if (authorRaw) localStorage.setItem('dmjt_forum_nick', authorRaw); } catch (e) {}

        var tempPost = {
          id: Date.now(),
          category: category,
          author_name: authorName,
          title: title,
          content: content,
          likes: 0,
          reply_count: 0,
          created_at: new Date().toISOString()
        };

        var nextList = [tempPost];
        for (var i = 0; i < allPosts.length; i++) {
          if (!allPosts[i].isSeed) nextList.push(allPosts[i]);
        }
        allPosts = nextList;
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(allPosts)); } catch (e) {}

        if (titleEl) titleEl.value = '';
        if (contentEl) contentEl.value = '';
        closeNewPostModal();
        renderPostsList();

        if (sb) {
          sb.from('forum_posts')
            .insert([{ category: category, author_name: authorName, title: title, content: content }])
            .select()
            .single()
            .then(function (res) {
              if (res && res.error) {
                showStatus('发帖同步失败（已暂存本地）：' + res.error.message);
                return;
              }
              if (res && res.data) {
                showStatus('');
                for (var j = 0; j < allPosts.length; j++) {
                  if (allPosts[j].id === tempPost.id) allPosts[j] = res.data;
                }
                try { localStorage.setItem(CACHE_KEY, JSON.stringify(allPosts)); } catch (e) {}
                renderPostsList();
              }
            });
        }
      }

      function renderRepliesHtml(replies, t) {
        if (!replies || replies.length === 0) {
          return '<p class="text-xs text-gray-400 text-center py-4">' + escapeHtml(t.noReplies) + '</p>';
        }
        var html = '';
        for (var i = 0; i < replies.length; i++) {
          var r = replies[i];
          html += '<div class="bg-slate-50 rounded-xl p-2.5 border border-slate-100">' +
            '<div class="flex items-center justify-between text-[10px] text-slate-400 mb-1">' +
            '<span class="font-bold text-slate-700">#' + (i + 1) + ' ' + escapeHtml(r.author_name) + '</span>' +
            '<span>' + escapeHtml(timeAgo(r.created_at)) + '</span>' +
            '</div>' +
            '<p class="text-xs text-slate-700 leading-relaxed whitespace-pre-wrap">' + escapeHtml(r.content) + '</p>' +
            '</div>';
        }
        return html;
      }

      function loadReplies(postId) {
        var t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
        var listEl = document.getElementById('repliesList');
        if (!listEl) return;

        if (!sb || postId < 0) {
          var demo = postId === -1
            ? [{ author_name: '吉隆坡阿杰', content: '报道！支持大马本地吹水站越做越好 👍', created_at: new Date().toISOString() }]
            : [];
          setText('repliesHeader', t.repliesHeader(demo.length));
          listEl.innerHTML = renderRepliesHtml(demo, t);
          return;
        }

        sb.from('forum_replies')
          .select('id,author_name,content,created_at')
          .eq('post_id', postId)
          .order('created_at', { ascending: true })
          .then(function (res) {
            var rows = res && Array.isArray(res.data) ? res.data : [];
            setText('repliesHeader', t.repliesHeader(rows.length));
            listEl.innerHTML = renderRepliesHtml(rows, t);
          });
      }

      function openPostDetail(postId) {
        var post = null;
        for (var i = 0; i < allPosts.length; i++) {
          if (allPosts[i].id === postId) { post = allPosts[i]; break; }
        }
        if (!post) return;
        activePost = post;

        var replyAuthorEl = document.getElementById('replyAuthorInput');
        if (replyAuthorEl) {
          try { replyAuthorEl.value = localStorage.getItem('dmjt_forum_nick') || ''; } catch (e) {}
        }

        setText('detailCatBadge', getCatLabel(post.category));
        setText('detailTitle', post.title);
        setText('detailMeta', post.author_name + ' · ' + timeAgo(post.created_at));
        setText('detailLikeBtn', '❤️ ' + (post.likes || 0));
        setText('detailContent', post.content);

        var modal = document.getElementById('detailModal');
        if (modal) modal.classList.remove('hidden');
        loadReplies(post.id);
      }

      function closeDetailModal() {
        var modal = document.getElementById('detailModal');
        if (modal) modal.classList.add('hidden');
        activePost = null;
      }

      function submitReply() {
        if (!activePost) return;
        var t = FORUM_I18N[currentLang] || FORUM_I18N.zh;
        var authorEl = document.getElementById('replyAuthorInput');
        var contentEl = document.getElementById('replyContentInput');
        var authorRaw = authorEl && authorEl.value ? authorEl.value.trim() : '';
        var content = contentEl && contentEl.value ? contentEl.value.trim() : '';
        if (!content) return;

        var authorName = authorRaw || t.defaultAuthor;
        try { if (authorRaw) localStorage.setItem('dmjt_forum_nick', authorRaw); } catch (e) {}
        if (contentEl) contentEl.value = '';

        if (activePost.isSeed || !sb) {
          alert('请先点击右上角「✏️ 发帖」发布一条真实话题后再进行盖楼回复！');
          return;
        }

        var targetPost = activePost;
        sb.from('forum_replies')
          .insert([{ post_id: targetPost.id, author_name: authorName, content: content }])
          .then(function (res) {
            if (res && res.error) {
              alert('回复失败：' + res.error.message);
              return;
            }
            var nextCount = (targetPost.reply_count || 0) + 1;
            targetPost.reply_count = nextCount;
            sb.from('forum_posts').update({ reply_count: nextCount }).eq('id', targetPost.id).then(function () {});
            loadReplies(targetPost.id);
            renderPostsList();
          });
      }

      function likeCurrentPost() {
        if (!activePost) return;
        var nextLikes = (activePost.likes || 0) + 1;
        activePost.likes = nextLikes;
        setText('detailLikeBtn', '❤️ ' + nextLikes);
        renderPostsList();

        if (!activePost.isSeed && sb) {
          sb.from('forum_posts').update({ likes: nextLikes }).eq('id', activePost.id).then(function () {});
        }
      }

      var bZh = document.getElementById('fLang-zh');
      var bEn = document.getElementById('fLang-en');
      var bMs = document.getElementById('fLang-ms');
      if (bZh) bZh.addEventListener('click', function () { switchForumLang('zh'); });
      if (bEn) bEn.addEventListener('click', function () { switchForumLang('en'); });
      if (bMs) bMs.addEventListener('click', function () { switchForumLang('ms'); });

      var searchInput = document.getElementById('forumSearchInput');
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(renderPostsList, 120);
        });
      }

      var topPostBtn = document.getElementById('topNewPostBtn');
      var botPostBtn = document.getElementById('bottomNewPostBtn');
      var closePostBtn = document.getElementById('closeNewPostBtn');
      var submitPostBtn = document.getElementById('submitPostBtn');
      var closeDetailBtn = document.getElementById('closeDetailBtn');
      var likeBtn = document.getElementById('detailLikeBtn');
      var sendReplyBtn = document.getElementById('sendReplyBtn');

      if (topPostBtn) topPostBtn.addEventListener('click', openNewPostModal);
      if (botPostBtn) botPostBtn.addEventListener('click', openNewPostModal);
      if (closePostBtn) closePostBtn.addEventListener('click', closeNewPostModal);
      if (submitPostBtn) submitPostBtn.addEventListener('click', submitNewPost);
      if (closeDetailBtn) closeDetailBtn.addEventListener('click', closeDetailModal);
      if (likeBtn) likeBtn.addEventListener('click', likeCurrentPost);
      if (sendReplyBtn) sendReplyBtn.addEventListener('click', submitReply);

      switchForumLang(currentLang);
      loadPosts();
    })();
  </script>
</body>
</html>
