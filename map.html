<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>大马吉通 · 站内原生导航 (CN/EN/BM) | 搜附近门店·营业状态·语音带路</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    #map { height: 44vh; min-height: 290px; width: 100%; z-index: 1; transition: height 0.3s ease; }
    body.nav-active #map { height: 64vh; min-height: 400px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .nav-car-dot {
      width: 22px; height: 22px; background: #059669; border: 3px solid #fff;
      border-radius: 50%; box-shadow: 0 0 12px rgba(5,150,105,0.9); position: relative;
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px;
    }
    .nav-car-dot::after {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      background: rgba(5,150,105,0.35); animation: pulse-ring 1.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

  <!-- 顶部导航栏（含三语切换按钮） -->
  <header class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white px-3 py-2.5 shadow-md sticky top-0 z-30">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <a href="/" id="backHomeBtn" class="bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-xl text-xs font-medium transition shrink-0">← 首页</a>
        <div>
          <h1 id="headerTitle" class="font-bold text-sm sm:text-base leading-tight">大马吉通 · 站内原生导航</h1>
          <p id="headerSub" class="text-[10px] sm:text-[11px] text-emerald-100">搜附近门店 · 实时营业状态 · 语音带路</p>
        </div>
      </div>

      <!-- CN / EN / BM 三语切换器 -->
      <div class="flex items-center gap-1 bg-black/20 p-1 rounded-full text-[11px] font-bold shrink-0">
        <button onclick="switchLang('zh')" id="lang-zh" class="lang-btn bg-white text-emerald-700 px-2 py-0.5 rounded-full transition">CN</button>
        <button onclick="switchLang('en')" id="lang-en" class="lang-btn text-white/90 px-2 py-0.5 rounded-full transition">EN</button>
        <button onclick="switchLang('ms')" id="lang-ms" class="lang-btn text-white/90 px-2 py-0.5 rounded-full transition">BM</button>
      </div>
    </div>
  </header>

  <!-- 导航中顶部实时路口指引横幅 -->
  <div id="liveNavBanner" class="hidden sticky top-[52px] z-30 bg-slate-900 text-white px-3 py-3 shadow-2xl border-b border-slate-700">
    <div class="max-w-2xl mx-auto space-y-2">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div id="liveTurnIcon" class="w-12 h-12 rounded-2xl bg-emerald-500 text-white flex items-center justify-center text-2xl font-black shrink-0 shadow">
            ⬆️
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span id="liveStepDist" class="text-xs font-black text-emerald-400">--</span>
              <span id="liveStepProgress" class="text-[10px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded">1 / 1</span>
            </div>
            <div id="liveStepText" class="text-sm font-bold leading-snug mt-0.5">--</div>
          </div>
        </div>
        <button onclick="stopLiveNav()" id="stopNavBtn" class="bg-rose-500 hover:bg-rose-600 active:scale-95 text-white text-xs font-bold px-3 py-2 rounded-xl shrink-0">
          结束导航
        </button>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-[11px]">
        <div class="flex items-center gap-2">
          <button id="voiceToggleBtn" onclick="toggleVoice()" class="bg-slate-800 hover:bg-slate-700 text-emerald-300 px-2.5 py-1 rounded-lg font-semibold">
            🔊 语音已开启
          </button>
          <button id="recenterBtn" onclick="recenterCamera()" class="bg-emerald-600/30 border border-emerald-500/50 text-emerald-200 px-2.5 py-1 rounded-lg font-semibold">
            🎯 视角锁定中 (18x)
          </button>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="manualStep(-1)" class="bg-slate-800 px-2 py-1 rounded text-slate-300">◀ 上一步</button>
          <button onclick="manualStep(1)" class="bg-slate-800 px-2 py-1 rounded text-emerald-300 font-bold">下一步 ▶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 城市快捷切换 -->
  <div id="cityBar" class="bg-white border-b border-slate-200 px-3 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar">
    <span id="cityLabel" class="text-xs text-slate-400 shrink-0 font-medium">城市：</span>
    <button onclick="locateMe(true)" id="quickNearMeCityBtn" class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-600 text-white shrink-0">📍 我附近</button>
    <button onclick="switchCity(3.1390, 101.6869, 'Kuala Lumpur')" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 shrink-0">吉隆坡 KL</button>
    <button onclick="switchCity(5.4141, 100.3288, 'Penang')" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 shrink-0">槟城 Penang</button>
    <button onclick="switchCity(1.4927, 103.7414, 'Johor Bahru')" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 shrink-0">新山 JB</button>
    <button onclick="switchCity(2.1896, 102.2501, 'Melaka')" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 shrink-0">马六甲 Melaka</button>
    <button onclick="switchCity(4.5975, 101.0901, 'Ipoh')" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 shrink-0">怡保 Ipoh</button>
    <button onclick="switchCity(5.9804, 116.0735, 'Kota Kinabalu')" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 shrink-0">亚庇 KK</button>
  </div>

  <!-- 起终点、附近连锁搜索、收藏夹与历史记录面板 -->
  <div id="searchBox" class="p-3 bg-white shadow-sm border-b border-slate-200">
    <div class="max-w-2xl mx-auto space-y-2">
      <!-- 出行模式切换 Tab -->
      <div class="grid grid-cols-3 gap-1.5 bg-slate-100 p-1 rounded-xl text-xs font-bold">
        <button id="mode-driving" onclick="setTravelMode('driving')" class="mode-tab bg-white text-emerald-700 py-1.5 rounded-lg shadow-sm transition">
          🚗 驾车
        </button>
        <button id="mode-transit" onclick="setTravelMode('transit')" class="mode-tab text-slate-600 py-1.5 rounded-lg transition">
          🚇 公交
        </button>
        <button id="mode-walking" onclick="setTravelMode('walking')" class="mode-tab text-slate-600 py-1.5 rounded-lg transition">
          🚶 步行
        </button>
      </div>

      <!-- 起点输入 -->
      <div class="flex items-center gap-2 bg-slate-100 rounded-xl px-3 py-2 border border-slate-200 focus-within:border-emerald-500 focus-within:bg-white">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>
        <input id="startInput" type="text" placeholder="自动定位当前位置中..." class="bg-transparent w-full text-sm focus:outline-none" />
        <button onclick="locateMe(true)" id="gpsBtn" class="text-xs text-emerald-600 font-semibold shrink-0 px-2 py-0.5 bg-emerald-50 rounded">📍 重新定位</button>
      </div>

      <!-- 目的地 / 搜附近门店输入 -->
      <div class="flex items-center gap-2 bg-slate-100 rounded-xl px-3 py-2 border border-slate-200 focus-within:border-rose-500 focus-within:bg-white">
        <span class="w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0"></span>
        <input id="endInput" type="text" placeholder="搜附近门店或目的地（如：麦当劳 / KFC / 油站 / 医院）" class="bg-transparent w-full text-sm focus:outline-none" />
        <button onclick="swapLocations()" id="swapBtn" class="text-xs text-slate-500 hover:text-slate-800 px-2 py-0.5 bg-white rounded border shrink-0">⇅ 互换</button>
      </div>

      <!-- 搜附近常用连锁店快捷栏（三语自动联动） -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-0.5">
        <span id="nearbyLabel" class="text-[11px] text-amber-600 font-bold shrink-0">🔍 搜最近：</span>
        <button onclick="quickNearby('KFC')" class="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 px-2 py-0.5 rounded shrink-0">🍗 KFC</button>
        <button id="chipMcd" onclick="quickNearby('McDonald\'s')" class="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 px-2 py-0.5 rounded shrink-0">🍔 麦当劳</button>
        <button onclick="quickNearby('7-Eleven')" class="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 px-2 py-0.5 rounded shrink-0">🏪 7-11</button>
        <button id="chipPetrol" onclick="quickNearby('Petronas')" class="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 px-2 py-0.5 rounded shrink-0">⛽ 加油站</button>
        <button id="chipWatsons" onclick="quickNearby('Watsons')" class="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 px-2 py-0.5 rounded shrink-0">💊 屈臣氏</button>
        <button id="chipHospital" onclick="quickNearby('Hospital')" class="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 px-2 py-0.5 rounded shrink-0">🏥 医院</button>
        <button onclick="quickNearby('MR DIY')" class="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 px-2 py-0.5 rounded shrink-0">🛠️ MR.DIY</button>
      </div>

      <!-- 附近多门店匹配结果列表（按营业中 + 距离从近到远排序） -->
      <div id="nearbyResultsBox" class="hidden bg-amber-50/90 border border-amber-200 rounded-xl p-2.5 space-y-1.5">
        <div class="flex items-center justify-between">
          <span id="nearbyResultsTitle" class="text-xs font-bold text-amber-900">📍 附近匹配的门店（优先营业中 · 从近到远）：</span>
          <button id="closeNearbyBtn" onclick="document.getElementById('nearbyResultsBox').classList.add('hidden')" class="text-[11px] text-slate-400 hover:text-slate-600">关闭 ✕</button>
        </div>
        <div id="nearbyResultsList" class="divide-y divide-amber-200/60 max-h-56 overflow-y-auto"></div>
      </div>

      <!-- 主搜索按钮 -->
      <button id="searchRouteBtn" onclick="planRoute()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-2.5 rounded-xl text-sm shadow transition">
        🧭 搜索附近最近门店并规划路线
      </button>

      <!-- 我的收藏夹 & 最近搜索历史 -->
      <div id="savedAndHistoryWrap" class="pt-1 space-y-1.5">
        <div id="favoritesBar" class="hidden flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          <span id="favTitleLabel" class="text-[11px] text-amber-600 font-bold shrink-0">⭐ 已收藏：</span>
          <div id="favoritesList" class="flex items-center gap-1.5"></div>
        </div>

        <div id="historyBar" class="hidden flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          <span id="histTitleLabel" class="text-[11px] text-slate-400 font-medium shrink-0">🕒 最近搜索：</span>
          <div id="historyList" class="flex items-center gap-1.5"></div>
          <button onclick="clearHistory()" id="clearHistBtn" class="text-[10px] text-rose-400 hover:text-rose-600 shrink-0 px-1.5">清空</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 站内交互式高清地图 -->
  <div class="relative">
    <div id="map"></div>
    <div id="mapBadge" class="absolute bottom-2 left-2 z-20 bg-white/95 backdrop-blur px-2.5 py-1 rounded-lg text-[11px] text-slate-700 shadow border border-slate-200">
      💡 提示：直接点击地图任意位置即可设为目的地
    </div>
  </div>

  <!-- 站内原生导航详情 + 营业状态 + 收藏按钮 + Grab / Waze 聚合栏 -->
  <div id="resultPanel" class="max-w-2xl mx-auto p-3 space-y-3 hidden">
    <div class="bg-white rounded-2xl p-4 shadow-sm border-2 border-emerald-500">
      <div class="flex items-start justify-between gap-2">
        <div>
          <div class="flex items-center gap-1.5 mb-1 flex-wrap">
            <span id="nativeTag" class="inline-block text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded">⭐ 大马吉通站内导航</span>
            <span id="destOpenBadge" class="hidden text-[10px] font-bold px-2 py-0.5 rounded"></span>
            <button onclick="saveCurrentToFavorites()" id="saveFavBtn" class="inline-flex items-center gap-1 text-[10px] font-bold bg-amber-100 hover:bg-amber-200 text-amber-800 px-2 py-0.5 rounded transition">
              <span>⭐</span> <span>收藏此地址</span>
            </button>
          </div>
          <div id="destDisplayTitle" class="text-xs font-bold text-slate-700 mb-0.5 truncate max-w-[210px] sm:max-w-xs">--</div>
          <div class="flex items-center gap-2">
            <span id="routeDistBadge" class="text-lg font-black text-slate-900">-- km</span>
            <span id="routeTimeBadge" class="text-xs font-bold bg-slate-100 text-slate-800 px-2.5 py-0.5 rounded-full">-- min</span>
          </div>
          <p id="routeSubInfo" class="text-xs text-slate-500 mt-1">--</p>
        </div>
        <button onclick="startLiveNav()" id="startNavBtn" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-xs px-4 py-3.5 rounded-xl shadow-lg flex items-center gap-1.5 shrink-0">
          <span>▶️</span> <span>开始站内导航</span>
        </button>
      </div>

      <!-- 外部 App 与电话确认快捷调用 -->
      <div class="mt-3 pt-3 border-t border-slate-100">
        <div id="extAppsLabel" class="text-[11px] text-slate-400 mb-2">出发前确认营业或调用其他出行工具：</div>
        <div class="grid grid-cols-3 gap-2">
          <a id="callOrCheckLink" href="#" target="_blank" class="bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-800 text-xs font-bold py-2 px-2 rounded-xl text-center transition">
            📞 确认营业<br><span id="callSubTag" class="text-[10px] font-normal text-amber-600">查电话/时间</span>
          </a>
          <a id="grabDeepLink" href="https://grab.onelink.me/2695613898" target="_blank" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 text-xs font-bold py-2 px-2 rounded-xl text-center transition">
            🚕 Grab 叫车<br><span id="grabPriceTag" class="text-[10px] font-normal text-emerald-600">RM --</span>
          </a>
          <a id="wazeDeepLink" href="#" target="_blank" class="bg-sky-50 hover:bg-sky-100 border border-sky-200 text-sky-800 text-xs font-bold py-2 px-2 rounded-xl text-center transition">
            🧭 Waze 导航<br><span class="text-[10px] font-normal text-sky-600">实时避堵</span>
          </a>
        </div>
      </div>
    </div>

    <!-- 公共交通 / 本地防迷路贴士卡片 -->
    <div id="transitGuideBox" class="hidden bg-blue-50 rounded-2xl p-4 border border-blue-200 space-y-1.5">
      <div class="font-bold text-sm text-blue-900" id="transitBoxTitle">🚇 本地公交 / 轨道交通乘车贴士</div>
      <div id="transitAdviceBody" class="text-xs text-blue-800 leading-relaxed space-y-1"></div>
    </div>

    <!-- 站内逐向转弯步骤列表 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <div class="flex items-center justify-between pb-2.5 mb-2 border-b border-slate-100">
        <h3 id="stepsHeader" class="font-bold text-sm text-slate-800">📋 站内逐步路线明细</h3>
        <span id="stepCountBadge" class="text-[11px] text-slate-400">0 steps</span>
      </div>
      <div id="stepsList" class="divide-y divide-slate-100 max-h-96 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- 底部常驻导航栏 -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 py-2 px-6 flex justify-around items-center z-30 text-xs">
    <a href="/" class="flex flex-col items-center text-slate-500 hover:text-emerald-600">
      <span class="text-lg">🏠</span>
      <span id="navHome">分类首页</span>
    </a>
    <a href="/map.html" class="flex flex-col items-center text-emerald-600 font-bold">
      <span class="text-lg">🧭</span>
      <span id="navMap">站内导航</span>
    </a>
    <a href="/" class="flex flex-col items-center text-slate-500 hover:text-emerald-600">
      <span class="text-lg">➕</span>
      <span id="navPost">发布信息</span>
    </a>
  </nav>

  <script>
    const i18n = {
      zh: {
        backHome: '← 首页',
        headerTitle: '大马吉通 · 站内原生导航',
        headerSub: '搜附近门店 · 实时营业状态 · 语音带路',
        cityLabel: '城市：',
        nearMeCity: '📍 我附近',
        modeDriving: '🚗 驾车',

        gpsBtn: '📍 重新定位',

        favTitle: '⭐ 已收藏：',
        histTitle: '🕒 最近搜索：',
        clearHist: '清空',
        saveFavBtn: '收藏此地址',
        savedFavDone: '已收藏 ✓',

        nativeTag: '⭐ 大马吉通站内导航',

        extApps: '出发前确认营业或调用其他出行工具：',
        stepsHeader: '📋 站内逐步路线明细',
        navHome: '分类首页',
        navMap: '站内导航',
        navPost: '发布信息',
        speechLang: 'zh-CN',
        startVoiceMsg: '开始导航。',
        status247: '🟢 24小时营业',
        statusOpenUntil: (t) => `🟢 营业中 (至 ${t})`,
        statusOpen: '🟢 营业中',
        statusClosed: (t) => t ? `🔴 已打烊 (${t} 开门)` : '🔴 已打烊',
        statusCheck: '🟡 建议先电话确认'
      },
      en: {
        backHome: '← Home',
        headerTitle: 'DamaJitong · In-App Navigation',
        headerSub: 'Nearby Stores · Live Open Status · Voice Nav',
        cityLabel: 'City:',
        nearMeCity: '📍 Near Me',
        modeDriving: '🚗 Drive',
        modeTransit: '🚇 Transit',
        modeWalking: '🚶 Walk',
        startPh: 'Start point or tap GPS',
        endPh: 'Search nearby store or place (e.g. McDonald\'s / Petrol / Hospital)',
        gpsBtn: '📍 My GPS',
        swapBtn: '⇅ Swap',
        nearbyLabel: '🔍 Nearest:',
        chipMcd: '🍔 McDonald\'s',
        chipPetrol: '⛽ Petrol',
        chipWatsons: '💊 Watsons',
        chipHospital: '🏥 Hospital',
        nearbyResultsTitle: '📍 Nearby matching places (Open first · Closest):',
        closeNearby: 'Close ✕',
        nearestBadge: 'Nearest',

    // ==================== 马来西亚本地时间实时营业状态解析引擎 ====================
    function getMalaysiaNow() {
      const now = new Date();
      const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utcMs + (8 * 3600000)); // UTC+8 Malaysia Time

    function evaluateOpeningStatus(tags = {}, fallbackName = '') {
      const t = i18n[currentLang];
      const rawOh = (tags.opening_hours || '').trim();
      const nameLower = `${tags.name || ''} ${tags.brand || ''} ${fallbackName}`.toLowerCase();
      const amenity = (tags.amenity || '').toLowerCase();
      const shop = (tags.shop || '').toLowerCase();

      const myDate = getMalaysiaNow();
      const curMins = myDate.getHours() * 60 + myDate.getMinutes();
      const dayIdx = myDate.getDay(); // 0=Sun, 6=Sat

      // 1. 明确 24/7
      if (/24\/7|24\s*hours/i.test(rawOh)) {
        return { state: 'open', text: t.status247, badgeClass: 'bg-emerald-100 text-emerald-700' };
      }

      // 2. 解析标准时间段如 "10:00-22:00" 或 "07:00-23:00"
      const timeMatch = rawOh.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
      if (timeMatch) {
        const openH = parseInt(timeMatch[1], 10);
        const openM = parseInt(timeMatch[2], 10);
        let closeH = parseInt(timeMatch[3], 10);
        const closeM = parseInt(timeMatch[4], 10);
        const openStr = `${String(openH).padStart(2, '0')}:${String(openM).padStart(2, '0')}`;
        const closeStr = `${String(closeH).padStart(2, '0')}:${String(closeM).padStart(2, '0')}`;

        const openMins = openH * 60 + openM;
        let closeMins = closeH * 60 + closeM;
        if (closeMins <= openMins) closeMins += 24 * 60; // 跨午夜（例如 10:00 - 02:00）
        const adjustedCur = curMins < openMins && closeMins > 24 * 60 ? curMins + 24 * 60 : curMins;

        if (adjustedCur >= openMins && adjustedCur < closeMins) {
          return { state: 'open', text: t.statusOpenUntil(closeStr), badgeClass: 'bg-emerald-100 text-emerald-700' };
        } else {
          return { state: 'closed', text: t.statusClosed(openStr), badgeClass: 'bg-rose-100 text-rose-700' };
        }
      }

      // 3. 大马常见 24 小时业态智能识别（7-11、KK Mart、Petronas、Shell、医院急诊）
      if (
        amenity === 'fuel' ||
        amenity === 'hospital' ||
        /7-eleven|7 eleven|kk super mart|petronas|shell|caltex|bhp|petron|hospital/i.test(nameLower)
      ) {
        return { state: 'open', text: t.status247, badgeClass: 'bg-emerald-100 text-emerald-700' };
      }

      // 4. 银行 / 政府部门（周一至周五 09:15 - 16:30）
      if (amenity === 'bank' || /maybank|cimb|public bank|rhb|hong leong|ambank|bank/i.test(nameLower)) {
        const isWeekday = dayIdx >= 1 && dayIdx <= 5;
        if (isWeekday && curMins >= 9 * 60 + 15 && curMins < 16 * 60 + 30) {
          return { state: 'open', text: t.statusOpenUntil('16:30'), badgeClass: 'bg-emerald-100 text-emerald-700' };
        }
        return { state: 'closed', text: t.statusClosed('09:15'), badgeClass: 'bg-rose-100 text-rose-700' };
      }

      // 5. 大型购物中心 / Watsons / MR.DIY 常规商场时段（10:00 - 22:00）
      if (shop === 'mall' || /mall|pavilion|mid valley|sunway|gurney|queensbay|komtar|watsons|guardian|mr\.?\s*diy/i.test(nameLower)) {
        if (curMins >= 10 * 60 && curMins < 22 * 60) {
          return { state: 'open', text: t.statusOpenUntil('22:00'), badgeClass: 'bg-emerald-100 text-emerald-700' };
        }
        return { state: 'closed', text: t.statusClosed('10:00'), badgeClass: 'bg-rose-100 text-rose-700' };
      }

      // 6. 未知营业时间的小店：白天时段给出温和提示，深夜给出“建议确认”提醒
      if (curMins >= 23 * 60 || curMins < 7 * 60) {
        return { state: 'unknown', text: t.statusCheck, badgeClass: 'bg-amber-100 text-amber-800' };
      }
      return { state: 'unknown', text: t.statusCheck, badgeClass: 'bg-slate-100 text-slate-600' };
    }

    async function normalizeSearchQuery(rawQuery) {
      let q = rawQuery.trim();
      const lowerQ = q.toLowerCase();
      for (const [alias, target] of Object.entries(cnAliasMap)) {
        if (lowerQ === alias.toLowerCase() || lowerQ.includes(alias.toLowerCase())) {
          return q.replace(new RegExp(alias, 'i'), target);
        }
      }
      if (/[\u4e00-\u9fa5]/.test(q)) {
        try {
          const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=${encodeURIComponent(q)}`;
          const res = await fetch(url);
          const json = await res.json();
          const enText = (json[0] || []).map(item => item[0]).join('').trim();
          if (enText) return enText;
        } catch (e) {}
      }
      return q;
    }

    // 真正的周边雷达搜索：扫描参考点方圆 8 公里内所有门店 + 计算营业状态 + 按营业中与距离排序
    async function searchPlacesNear(rawQuery, refLat, refLng) {
      const query = await normalizeSearchQuery(rawQuery);
      let candidates = [];

      // 1. Overpass API 周边 8000 米真实 POI 雷达
      try {
        const cleanKw = query.replace(/["\\]/g, '').trim();
        const overpassQuery = `[out:json][timeout:7];(node["name"~"${cleanKw}",i](around:8000,${refLat},${refLng});way["name"~"${cleanKw}",i](around:8000,${refLat},${refLng});node["brand"~"${cleanKw}",i](around:8000,${refLat},${refLng});way["brand"~"${cleanKw}",i](around:8000,${refLat},${refLng}););out center 20;`;
        const ovRes = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: 'data=' + encodeURIComponent(overpassQuery)
        });
        if (ovRes.ok) {
          const ovData = await ovRes.json();
          if (ovData && ovData.elements && ovData.elements.length > 0) {
            candidates = ovData.elements.map(el => {
              const lat = el.lat || (el.center && el.center.lat);
              const lng = el.lon || (el.center && el.center.lon);
              if (!lat || !lng) return null;
              const tags = el.tags || {};
              const name = tags.name || tags.brand || query;
              const addrParts = [tags['addr:street'], tags['addr:suburb'], tags['addr:city']].filter(Boolean);
              const fullAddr = addrParts.join(', ') || (currentLang === 'zh' ? '附近门店' : 'Nearby Branch');
              const straightKm = map.distance([refLat, refLng], [lat, lng]) / 1000;
              const status = evaluateOpeningStatus(tags, name);
              const phone = tags.phone || tags['contact:phone'] || '';
              return { lat, lng, name, fullAddr, straightKm, status, phone };
            }).filter(Boolean);
          }
        }
      } catch (e) {
        console.warn('Overpass fallback to Nominatim:', e);
      }

      // 2. 兜底使用 Nominatim（限制 0.08 度小视野优先）
      if (candidates.length === 0) {
        const delta = 0.08;
        const viewbox = `${refLng - delta},${refLat + delta},${refLng + delta},${refLat - delta}`;
        const url = `https://nominatim.openstreetmap.org/search?format=json&extratags=1&countrycodes=my&limit=12&viewbox=${viewbox}&bounded=0&q=${encodeURIComponent(query)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.length > 0) {
          candidates = data.map(item => {
            const lat = parseFloat(item.lat);
            const lng = parseFloat(item.lon);
            const straightKm = map.distance([refLat, refLng], [lat, lng]) / 1000;
            const parts = item.display_name.split(',').map(s => s.trim());
            const tags = item.extratags || {};
            const status = evaluateOpeningStatus(tags, parts[0]);
            const phone = tags.phone || tags['contact:phone'] || '';
            return { lat, lng, name: parts[0], fullAddr: parts.slice(1, 4).join(', '), straightKm, status, phone };
          });
        }
      }

      if (candidates.length === 0) return [];

      // 去重（相距小于 80 米的同名点合并）
      const deduped = [];
      candidates.sort((a, b) => a.straightKm - b.straightKm).forEach(item => {
        const exists = deduped.some(d => map.distance([d.lat, d.lng], [item.lat, item.lng]) < 80);
        if (!exists) deduped.push(item);
      });
      const preSorted = deduped.slice(0, 8);

      // 3. 调用 OSRM 计算实际道路距离与时间
      try {
        const coordsStr = [`${refLng},${refLat}`, ...preSorted.map(p => `${p.lng},${p.lat}`)].join(';');
        const profile = currentMode === 'walking' ? 'foot' : 'driving';
        const tableUrl = `https://router.project-osrm.org/table/v1/${profile}/${coordsStr}?sources=0&annotations=distance,duration`;
        const tableRes = await fetch(tableUrl);
        const tableData = await tableRes.json();

        if (tableData && tableData.distances && tableData.distances[0]) {
          const dists = tableData.distances[0];
          const durs = tableData.durations[0];
          preSorted.forEach((item, idx) => {
            const dMeters = dists[idx + 1];
            const dSecs = durs[idx + 1];
            item.distKm = dMeters != null ? (dMeters / 1000) : item.straightKm;
            if (currentMode === 'walking') {
              item.durationMin = Math.max(3, Math.round(item.distKm * 12));
            } else {
              item.durationMin = dSecs != null ? Math.max(2, Math.round(dSecs / 60)) : Math.max(3, Math.round(item.distKm * 1.8));
            }
          });
        }
      } catch (e) {
        preSorted.forEach(item => {
          item.distKm = item.straightKm;
          item.durationMin = currentMode === 'walking'
            ? Math.max(3, Math.round(item.straightKm * 12))
            : Math.max(3, Math.round(item.straightKm * 1.8));
        });
      }

      // 排序规则：未明确打烊的店优先，其次按实际距离从近到远排序
      preSorted.sort((a, b) => {
        const aClosed = a.status?.state === 'closed' ? 1 : 0;
        const bClosed = b.status?.state === 'closed' ? 1 : 0;
        if (aClosed !== bClosed) return aClosed - bClosed;
        return a.distKm - b.distKm;
      });

      return preSorted;
    }

    function selectNearbyCandidate(lat, lng, name, fullAddr, statusText = '', statusClass = '', phone = '') {
      endCoords = {
        lat,
        lng,
        name: `${name}${fullAddr && fullAddr !== '附近门店' && fullAddr !== 'Nearby Branch' ? ' · ' + fullAddr.split(',')[0] : ''}`,
        status: statusText ? { text: statusText, badgeClass: statusClass } : null,
        phone
      };
      document.getElementById('endInput').value = endCoords.name;
      calculateAndRenderRoute();
    }

    function translateStep(step) {
      const type = step.maneuver?.type || '';
      const mod = step.maneuver?.modifier || '';
      const road = step.name || (currentLang === 'zh' ? '前方道路' : (currentLang === 'ms' ? 'jalan hadapan' : 'road ahead'));
      const dist = step.distance >= 1000
        ? `${(step.distance / 1000).toFixed(1)} km`
        : `${Math.max(10, Math.round(step.distance))} m`;

      let icon = '⬆️';
      if (type === 'depart') icon = '🚀';
      else if (type === 'arrive') icon = '🏁';
      else if (type === 'roundabout' || type === 'rotary') icon = '🔄';
      else if (mod.includes('left')) icon = mod.includes('slight') ? '↖️' : '⬅️';
      else if (mod.includes('right')) icon = mod.includes('slight') ? '↗️' : '➡️';
      else if (mod.includes('uturn')) icon = '↩️';

      if (currentLang === 'en') {
        if (type === 'depart') return { icon, text: `Start on ${road}`, dist };
        if (type === 'arrive') return { icon, text: `Arrive at destination (${road})`, dist: 'Arrived' };
        if (type === 'roundabout' || type === 'rotary') return { icon, text: `Enter roundabout and exit onto ${road}`, dist };
        if (mod.includes('left')) return { icon, text: `${mod.includes('slight') ? 'Keep left' : 'Turn left'} onto ${road}`, dist };
        if (mod.includes('right')) return { icon, text: `${mod.includes('slight') ? 'Keep right' : 'Turn right'} onto ${road}`, dist };
        if (mod.includes('uturn')) return { icon, text: `Make a U-turn onto ${road}`, dist };
        return { icon, text: `Continue straight on ${road}`, dist };
      }

      if (currentLang === 'ms') {
        if (type === 'depart') return { icon, text: `Mula perjalanan di ${road}`, dist };
        if (type === 'arrive') return { icon, text: `Tiba di destinasi (${road})`, dist: 'Tiba' };
        if (type === 'roundabout' || type === 'rotary') return { icon, text: `Masuk bulatan dan keluar ke ${road}`, dist };
        if (mod.includes('left')) return { icon, text: `${mod.includes('slight') ? 'Ikut kiri' : 'Belok kiri'} ke ${road}`, dist };
        if (mod.includes('right')) return { icon, text: `${mod.includes('slight') ? 'Ikut kanan' : 'Belok kanan'} ke ${road}`, dist };
        if (mod.includes('uturn')) return { icon, text: `Pusingan U ke ${road}`, dist };
        return { icon, text: `Terus ke hadapan di ${road}`, dist };
      }

      if (type === 'depart') return { icon, text: `从起点出发，沿「${road}」前行`, dist };
      if (type === 'arrive') return { icon, text: `抵达目的地「${road}」`, dist: '已到达' };
      if (type === 'roundabout' || type === 'rotary') return { icon, text: `进入环岛，驶出进入「${road}」`, dist };
      if (mod.includes('left')) return { icon, text: `${mod.includes('slight') ? '靠左前方行驶' : '左转'}进入「${road}」`, dist };
      if (mod.includes('right')) return { icon, text: `${mod.includes('slight') ? '靠右前方行驶' : '右转'}进入「${road}」`, dist };
      if (mod.includes('uturn')) return { icon, text: `前方掉头进入「${road}」`, dist };
      return { icon, text: `继续直行沿「${road}」前进`, dist };
    }

    async function planRoute() {
      const btn = document.getElementById('searchRouteBtn');
      const startText = document.getElementById('startInput').value.trim();
      const endText = document.getElementById('endInput').value.trim();
      const t = i18n[currentLang];

      if (!endText && !endCoords) {
        alert(currentLang === 'zh' ? '请先输入目的地或连锁店名（如 麦当劳 / KFC），或直接点击地图！' : 'Please enter destination or store name!');
        return;
      }

      btn.innerText = t.searchingBtn;
      btn.disabled = true;

      try {
        const mapCenter = map.getCenter();
        if (!startText) {
          startCoords = { lat: mapCenter.lat, lng: mapCenter.lng, name: 'Map Center' };
          document.getElementById('startInput').value = currentLang === 'zh' ? '当前地图中心' : 'Map Center';
        } else if (!startText.includes('(GPS)') && !startText.includes('Map Center') && !startText.includes('地图中心')) {
          const startMatches = await searchPlacesNear(startText, mapCenter.lat, mapCenter.lng);
          if (startMatches.length > 0) startCoords = startMatches[0];
        }

        const refLat = startCoords ? startCoords.lat : mapCenter.lat;
        const refLng = startCoords ? startCoords.lng : mapCenter.lng;

        if (!endText.startsWith('Pin (')) {
          const matches = await searchPlacesNear(endText, refLat, refLng);
          if (matches.length === 0) {
            alert(currentLang === 'zh' ? '附近 8km 内未找到该地点，建议拖动地图到目标城市或换个关键词再试！' : 'Location not found nearby, please try another keyword!');
            btn.innerText = t.searchBtn;
            btn.disabled = false;
            return;
          }

          // 在地图上标出附近所有匹配分店的小黄点，方便一眼看清周围分布
          nearbyMarkersLayer.clearLayers();
          matches.forEach((m) => {
            const dot = L.circleMarker([m.lat, m.lng], {
              radius: 7, fillColor: m.status?.state === 'closed' ? '#e11d48' : '#f59e0b',
              color: '#fff', weight: 2, fillOpacity: 0.95
            }).bindPopup(`<b>${m.name}</b><br>${m.status?.text || ''}<br>${m.distKm.toFixed(1)} km`);
            nearbyMarkersLayer.addLayer(dot);
          });

          const nearest = matches[0];
          endCoords = {
            lat: nearest.lat,
            lng: nearest.lng,
            name: `${nearest.name}${nearest.fullAddr && nearest.fullAddr !== '附近门店' && nearest.fullAddr !== 'Nearby Branch' ? ' · ' + nearest.fullAddr.split(',')[0] : ''}`,
            status: nearest.status,
            phone: nearest.phone
          };

          const nearbyBox = document.getElementById('nearbyResultsBox');
          const nearbyList = document.getElementById('nearbyResultsList');
          if (matches.length >= 1) {
            nearbyBox.classList.remove('hidden');
            nearbyList.innerHTML = matches.map((m, idx) => `
              <div onclick="selectNearbyCandidate(${m.lat}, ${m.lng}, '${m.name.replace(/'/g, "\\'")}', '${m.fullAddr.replace(/'/g, "\\'")}', '${(m.status?.text || '').replace(/'/g, "\\'")}', '${m.status?.badgeClass || ''}', '${(m.phone || '').replace(/'/g, "\\'")}')"
                   class="py-2 px-1.5 hover:bg-amber-100/70 rounded-lg cursor-pointer flex items-center justify-between gap-2 transition">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1 flex-wrap">
                    ${idx === 0 ? `<span class="text-[10px] bg-emerald-600 text-white px-1.5 py-0.2 rounded font-bold">${t.nearestBadge}</span>` : ''}
                    <span class="text-xs font-bold text-slate-800 truncate">${m.name}</span>
                  </div>
                  <div class="flex items-center gap-1.5 mt-0.5 flex-wrap">
                    ${m.status ? `<span class="text-[10px] font-bold px-1.5 py-0.2 rounded ${m.status.badgeClass}">${m.status.text}</span>` : ''}
                    <span class="text-[10px] text-slate-500 truncate">${m.fullAddr}</span>
                  </div>
                </div>
                <div class="text-right shrink-0">
                  <div class="text-xs font-black text-amber-700">${m.distKm.toFixed(1)} km</div>
                  <div class="text-[10px] text-slate-400">${t.approxMin(m.durationMin)}</div>
                </div>
              </div>
            `).join('');
          }
        }

        addToHistory(endCoords);
        await calculateAndRenderRoute();
      } catch (err) {
        console.error(err);
        alert('Error calculating route, please try again!');
      } finally {
        btn.innerText = i18n[currentLang].searchBtn;
        btn.disabled = false;
      }
    }

    async function calculateAndRenderRoute() {
      if (!startCoords || !endCoords) return;

      if (startMarker) map.removeLayer(startMarker);
      if (endMarker) map.removeLayer(endMarker);
      startMarker = L.marker([startCoords.lat, startCoords.lng]).addTo(map).bindPopup(`🟢 ${startCoords.name}`);
      endMarker = L.marker([endCoords.lat, endCoords.lng]).addTo(map).bindPopup(`🔴 ${endCoords.name}<br>${endCoords.status?.text || ''}`).openPopup();

      const profile = currentMode === 'walking' ? 'foot' : 'driving';
      const osrmUrl = `https://router.project-osrm.org/route/v1/${profile}/${startCoords.lng},${startCoords.lat};${endCoords.lng},${endCoords.lat}?overview=full&geometries=geojson&steps=true`;
      const routeRes = await fetch(osrmUrl);
      const routeData = await routeRes.json();

      if (!routeData || !routeData.routes || routeData.routes.length === 0) {
        alert('Route not found / 暂未匹配到路线');
        return;
      }

      const route = routeData.routes[0];
      const distKm = (route.distance / 1000).toFixed(1);
      let durationMin = Math.max(2, Math.round(route.duration / 60));
      if (currentMode === 'walking') durationMin = Math.max(3, Math.round(distKm * 12));
      if (currentMode === 'transit') durationMin = Math.max(8, Math.round(durationMin * 1.45 + 10));

      if (routeLine) map.removeLayer(routeLine);
      const lineColor = currentMode === 'walking' ? '#2563eb' : (currentMode === 'transit' ? '#7c3aed' : '#059669');
      routeLine = L.geoJSON(route.geometry, {
        style: { color: lineColor, weight: 7, opacity: 0.9, dashArray: currentMode === 'walking' ? '8, 8' : null }
      }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding: [35, 35] });

      const fuelCost = (distKm * 0.08 * 2.05).toFixed(2);
      const grabEst = Math.max(5, Math.round(4 + distKm * 1.35));
      document.getElementById('destDisplayTitle').innerText = `📍 ${endCoords.name}`;
      document.getElementById('routeDistBadge').innerText = `${distKm} km`;
      document.getElementById('routeTimeBadge').innerText = `${durationMin} min`;
      document.getElementById('grabPriceTag').innerText = `~RM ${grabEst}`;

      // 显示目的地营业状态徽章
      const openBadge = document.getElementById('destOpenBadge');
      if (endCoords.status && endCoords.status.text) {
        openBadge.className = `inline-block text-[10px] font-bold px-2 py-0.5 rounded ${endCoords.status.badgeClass}`;
        openBadge.innerText = endCoords.status.text;
        openBadge.classList.remove('hidden');
      } else {
        openBadge.classList.add('hidden');
      }

      // 绑定一键打电话或 Google 实时营业时间核查链接
      const callLink = document.getElementById('callOrCheckLink');
      const callSub = document.getElementById('callSubTag');
      if (endCoords.phone) {
        callLink.href = `tel:${endCoords.phone.replace(/[^0-9+]/g, '')}`;
        callLink.removeAttribute('target');
        callSub.innerText = endCoords.phone;
      } else {
        callLink.href = `https://www.google.com/search?q=${encodeURIComponent(endCoords.name + ' Malaysia opening hours')}`;
        callLink.target = '_blank';
        callSub.innerText = currentLang === 'zh' ? '查电话/时间' : 'Check Hours';
      }

      const saveBtn = document.getElementById('saveFavBtn');
      saveBtn.innerHTML = `<span>⭐</span> <span>${i18n[currentLang].saveFavBtn}</span>`;

      if (currentLang === 'en') {
        document.getElementById('routeSubInfo').innerText = `Est. Petrol RM ${fuelCost} · Grab Ref ~RM ${grabEst}`;
      } else if (currentLang === 'ms') {
        document.getElementById('routeSubInfo').innerText = `Anggaran Petrol RM ${fuelCost} · Grab ~RM ${grabEst}`;
      } else {
        document.getElementById('routeSubInfo').innerText = `自驾预估油费 RM ${fuelCost} · Grab 参考约 RM ${grabEst}`;
      }

      document.getElementById('wazeDeepLink').href = `https://waze.com/ul?ll=${endCoords.lat},${endCoords.lng}&navigate=yes`;

      const transitBox = document.getElementById('transitGuideBox');
      if (currentMode === 'transit') {
        transitBox.classList.remove('hidden');
        if (currentLang === 'en') {
          document.getElementById('transitBoxTitle').innerText = '🚇 Malaysia Public Transit Guide';
          document.getElementById('transitAdviceBody').innerHTML = `<p>• <b>KL/Selangor:</b> Use LRT/MRT/Monorail or Rapid KL bus (Touch 'n Go or Visa/Master PayWave accepted).</p><p>• <b>Penang:</b> Rapid Penang bus requires exact cash fare (no change given).</p>`;
        } else if (currentLang === 'ms') {
          document.getElementById('transitBoxTitle').innerText = '🚇 Panduan Pengangkutan Awam Malaysia';
          document.getElementById('transitAdviceBody').innerHTML = `<p>• <b>KL/Selangor:</b> Gunakan LRT/MRT/Monorel atau bas Rapid KL (Kad Touch 'n Go / PayWave diterima).</p><p>• <b>Pulau Pinang:</b> Bas Rapid Penang memerlukan wang tunai secukupnya.</p>`;
        } else {
          document.getElementById('transitBoxTitle').innerText = '🚇 大马本地公交 / 轨道交通乘车贴士';
          document.getElementById('transitAdviceBody').innerHTML = `<p>• <b>吉隆坡/雪兰莪：</b>优先搭乘 LRT / MRT / Monorail 或 Rapid KL 巴士，进站支持 <b>Touch 'n Go 卡</b> 或 Visa/Master 拍卡。</p><p>• <b>槟城地区：</b>搭乘 Rapid Penang 巴士需自备零钱投币（不设找零），乔治市老城区可坐免费 CAT 巴士。</p>`;
        }
      } else {
        transitBox.classList.add('hidden');
      }

      const rawSteps = route.legs[0]?.steps || [];
      currentSteps = rawSteps.map((s, idx) => {
        const t = translateStep(s);
        return {
          index: idx,
          icon: t.icon,
          text: t.text,
          dist: t.dist,
          location: s.maneuver?.location
        };
      });

      document.getElementById('stepCountBadge').innerText = `${currentSteps.length} steps`;
      const stepsContainer = document.getElementById('stepsList');
      stepsContainer.innerHTML = currentSteps.map((st, i) => `
        <div onclick="focusStep(${i})" class="py-2.5 px-2 hover:bg-slate-50 rounded-xl cursor-pointer flex items-center justify-between gap-3 transition">
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-base shrink-0">${st.icon}</span>
            <div>
              <div class="text-xs font-bold text-slate-800">${st.text}</div>
              <div class="text-[11px] text-slate-400">#${i + 1}</div>
            </div>
          </div>
          <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded shrink-0">${st.dist}</span>
        </div>
      `).join('');

      const panel = document.getElementById('resultPanel');
      panel.classList.remove('hidden');
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function getSavedList(key) {
      try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; }
    }

    function setSavedList(key, list) {
      try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {}
    }

    function addToHistory(place) {
      if (!place || !place.name) return;
      let hist = getSavedList(STORAGE_HIST_KEY);
      hist = hist.filter(item => item.name !== place.name);
      hist.unshift({ name: place.name, lat: place.lat, lng: place.lng });
      if (hist.length > 8) hist = hist.slice(0, 8);
      setSavedList(STORAGE_HIST_KEY, hist);
      renderSavedAndHistory();
    }

    function clearHistory() {
      setSavedList(STORAGE_HIST_KEY, []);
      renderSavedAndHistory();
    }

    function saveCurrentToFavorites() {
      if (!endCoords) return;
      const customLabel = prompt(
        currentLang === 'zh' ? '请给这个收藏地点起个名字（例如：家、公司、酒店）：' : 'Enter a label for this saved place (e.g. Home, Office):',
        endCoords.name.split('·')[0].trim()
      );
      if (customLabel === null) return;
      const label = customLabel.trim() || endCoords.name;

      let favs = getSavedList(STORAGE_FAV_KEY);
      favs = favs.filter(item => item.label !== label);
      favs.unshift({ label, name: endCoords.name, lat: endCoords.lat, lng: endCoords.lng });
      if (favs.length > 12) favs = favs.slice(0, 12);
      setSavedList(STORAGE_FAV_KEY, favs);

      document.getElementById('saveFavBtn').innerHTML = `<span>✅</span> <span>${i18n[currentLang].savedFavDone}</span>`;
      renderSavedAndHistory();
    }

    function removeFavorite(idx, event) {
      event.stopPropagation();
      let favs = getSavedList(STORAGE_FAV_KEY);
      favs.splice(idx, 1);
      setSavedList(STORAGE_FAV_KEY, favs);
      renderSavedAndHistory();
    }

    function useSavedPlace(lat, lng, name) {
      endCoords = { lat, lng, name, status: null, phone: '' };
      document.getElementById('endInput').value = name;
      if (!startCoords) {
        const c = map.getCenter();
        startCoords = { lat: c.lat, lng: c.lng, name: currentLang === 'zh' ? '当前地图中心' : 'Map Center' };
        document.getElementById('startInput').value = startCoords.name;
      }
      calculateAndRenderRoute();
    }

    function renderSavedAndHistory() {
      const favs = getSavedList(STORAGE_FAV_KEY);
      const favBar = document.getElementById('favoritesBar');
      const favList = document.getElementById('favoritesList');

      if (favs.length > 0) {
        favBar.classList.remove('hidden');
        favList.innerHTML = favs.map((f, idx) => `
          <div onclick="useSavedPlace(${f.lat}, ${f.lng}, '${f.name.replace(/'/g, "\\'")}')"
               class="inline-flex items-center gap-1 bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-900 text-[11px] font-semibold px-2 py-0.5 rounded-full cursor-pointer shrink-0">
            <span>📌 ${f.label}</span>
            <button onclick="removeFavorite(${idx}, event)" class="text-amber-500 hover:text-rose-600 ml-0.5">×</button>
          </div>
        `).join('');
      } else {
        favBar.classList.add('hidden');
      }

      const hist = getSavedList(STORAGE_HIST_KEY);
      const histBar = document.getElementById('historyBar');
      const histList = document.getElementById('historyList');

      if (hist.length > 0) {
        histBar.classList.remove('hidden');
        histList.innerHTML = hist.map(h => `
          <button onclick="useSavedPlace(${h.lat}, ${h.lng}, '${h.name.replace(/'/g, "\\'")}')"
                  class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-[11px] px-2 py-0.5 rounded-full shrink-0 max-w-[140px] truncate">
            ${h.name}
          </button>
        `).join('');
      } else {
        histBar.classList.add('hidden');
      }
    }

    renderSavedAndHistory();
    switchLang(currentLang);

    function focusStep(idx) {
      const st = currentSteps[idx];
      if (st && st.location) {
        map.setView([st.location[1], st.location[0]], 18);
        L.popup().setLatLng([st.location[1], st.location[0]]).setContent(`<b>${st.icon} ${st.text}</b><br><span style="color:#666;font-size:12px;">${st.dist}</span>`).openOn(map);
      }
    }

    function speakText(msg) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(msg);
        const voices = window.speechSynthesis.getVoices();
        const targetLang = i18n[currentLang].speechLang;
        const hasTargetVoice = voices.some(v => v.lang.toLowerCase().includes(targetLang.slice(0, 2).toLowerCase()));
        utter.lang = hasTargetVoice ? targetLang : 'en-US';
        utter.volume = 1.0;
        utter.rate = 1.0;
        utter.pitch = 1.0;
        window.speechSynthesis.speak(utter);
      } catch (e) {
        console.warn('Speech error:', e);
      }
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('voiceToggleBtn').innerText = voiceEnabled ? i18n[currentLang].voiceOn : i18n[currentLang].voiceOff;
      if (voiceEnabled && currentSteps[currentStepIdx]) {
        speakText(currentSteps[currentStepIdx].text);
      }
    }

    function recenterCamera() {
      cameraLocked = true;
      document.getElementById('recenterBtn').innerText = i18n[currentLang].lockedText;
      document.getElementById('recenterBtn').className = 'bg-emerald-600/30 border border-emerald-500/50 text-emerald-200 px-2.5 py-1 rounded-lg font-semibold';

      if (userLiveMarker) {
        map.flyTo(userLiveMarker.getLatLng(), 18, { duration: 0.6 });
      } else if (currentSteps[currentStepIdx]?.location) {
        const loc = currentSteps[currentStepIdx].location;
        map.flyTo([loc[1], loc[0]], 18, { duration: 0.6 });
      } else if (startCoords) {
        map.flyTo([startCoords.lat, startCoords.lng], 18, { duration: 0.6 });
      }
    }

    function manualStep(delta) {
      const next = currentStepIdx + delta;
      if (next >= 0 && next < currentSteps.length) {
        currentStepIdx = next;
        updateBannerStep(currentSteps[currentStepIdx]);
        speakText(currentSteps[currentStepIdx].text);
        const loc = currentSteps[currentStepIdx].location;
        if (loc) {
          cameraLocked = true;
          map.flyTo([loc[1], loc[0]], 18, { duration: 0.6 });
        }
      }
    }

    async function startLiveNav() {
      if (!currentSteps.length) return;

      isNavigating = true;
      cameraLocked = true;
      currentStepIdx = 0;

      document.body.classList.add('nav-active');
      document.getElementById('liveNavBanner').classList.remove('hidden');
      document.getElementById('searchBox').classList.add('hidden');
      document.getElementById('cityBar').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      updateBannerStep(currentSteps[0]);
      speakText(`${i18n[currentLang].startVoiceMsg}${currentSteps[0].text}`);

      setTimeout(() => {
        map.invalidateSize();
        if (startCoords) {
          updateLiveUserDot(startCoords.lat, startCoords.lng);
          map.flyTo([startCoords.lat, startCoords.lng], 18, { duration: 0.8 });
        }
      }, 150);

      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            updateLiveUserDot(lat, lng);

            if (cameraLocked) {
              map.setView([lat, lng], 18, { animate: true });
            }

            for (let i = currentStepIdx + 1; i < currentSteps.length; i++) {
              const loc = currentSteps[i].location;
              if (!loc) continue;
              const d = map.distance([lat, lng], [loc[1], loc[0]]);
              if (d < 65) {
                currentStepIdx = i;
                updateBannerStep(currentSteps[i]);
                speakText(currentSteps[i].text);
                break;
              }
            }
          },
          (err) => console.warn('GPS tracking:', err),
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      }
    }

    function updateBannerStep(step) {
      document.getElementById('liveTurnIcon').innerText = step.icon;
      document.getElementById('liveStepDist').innerText = step.dist;
      document.getElementById('liveStepText').innerText = step.text;
      document.getElementById('liveStepProgress').innerText = `${currentStepIdx + 1} / ${currentSteps.length}`;
    }

    function stopLiveNav() {
      isNavigating = false;
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (wakeLock !== null) {
        try { wakeLock.release(); wakeLock = null; } catch (e) {}
      }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      document.body.classList.remove('nav-active');
      document.getElementById('liveNavBanner').classList.add('hidden');
      document.getElementById('searchBox').classList.remove('hidden');
      document.getElementById('cityBar').classList.remove('hidden');

      setTimeout(() => {
        map.invalidateSize();
        if (routeLine) map.fitBounds(routeLine.getBounds(), { padding: [35, 35] });
      }, 150);
    }
  </script>
</body>
</html>
