<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新马关卡实时路况 - 大马吉通 DamaJitong</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #eef0f4;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="max-w-md mx-auto bg-[#f5f6f8] min-h-screen flex flex-col shadow-[0_0_40px_rgba(15,23,42,0.12)]">

  <!-- 顶部栏 + 三语切换 -->
  <header class="bg-gradient-to-br from-emerald-600 via-teal-600 to-cyan-700 text-white px-4 pt-4 pb-6 rounded-b-[26px] shadow-md">
    <div class="flex items-center justify-between gap-2 mb-3">
      <a href="/index.html" id="backHomeLink" class="text-xs font-bold bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">
        ← 返回首页
      </a>

      <div class="flex items-center bg-black/20 rounded-full p-0.5 text-[11px] font-bold border border-white/15">
        <button type="button" onclick="setTrafficLang('zh')" id="tLang-zh" class="px-2.5 py-0.5 rounded-full bg-white text-emerald-700 transition">CN</button>
        <button type="button" onclick="setTrafficLang('en')" id="tLang-en" class="px-2.5 py-0.5 rounded-full text-white/90 hover:text-white transition">EN</button>
        <button type="button" onclick="setTrafficLang('ms')" id="tLang-ms" class="px-2.5 py-0.5 rounded-full text-white/90 hover:text-white transition">BM</button>
      </div>

      <button type="button" id="refreshBtn" onclick="loadTrafficCameras(true)"
              class="text-xs font-bold bg-white text-emerald-700 hover:bg-emerald-50 px-3 py-1.5 rounded-full shadow-xs transition">
        🔄 刷新
      </button>
    </div>

    <h1 id="pageTitle" class="font-black text-lg tracking-tight">🚦 新马关卡实时路况与堵车预计</h1>
    <p id="pageSub" class="text-[11px] text-emerald-100 mt-0.5">
      兀兰 & 大士双向预计车程 · 实时关卡抓拍 · 缩时回放
    </p>
  </header>

  <!-- 汇率与同步状态条 -->
  <section class="mx-3 -mt-3.5 bg-white rounded-2xl p-3 shadow-xs border border-gray-100 flex items-center justify-between gap-2 text-xs">
    <div>
      <div id="rateLabel" class="text-[10px] text-gray-400">实时参考汇率</div>
      <div id="sgdRateText" class="font-black text-blue-600">1 SGD ≈ 3.19 MYR</div>
    </div>
    <div class="text-center">
      <div id="autoCountdownLabel" class="text-[10px] text-gray-400">自动检测</div>
      <div id="autoCountdownText" class="font-extrabold text-emerald-600">30s</div>
    </div>
    <div class="text-right">
      <div id="syncLabel" class="text-[10px] text-gray-400">最近检测</div>
      <div id="lastSyncText" class="font-bold text-gray-700">--:--:--</div>
    </div>
  </section>

  <!-- 4 向路段实时堵车耗时看板（类似 Checkpoint.sg 分段预计分钟数） -->
  <section class="mx-3 mt-2.5 bg-white rounded-2xl p-3 shadow-xs border border-gray-100 space-y-2.5">
    <div class="flex items-center justify-between gap-2">
      <span id="estBoardTitle" class="font-black text-xs text-gray-900">⏱️ 各路段预计通行时间（含当前路况）</span>
      <span id="estSourceBadge" class="text-[9px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full">实时测算</span>
    </div>
    <div id="routeEstimatesGrid" class="grid grid-cols-1 gap-2">
      <div class="text-center py-4 text-xs text-gray-400">正在测算各路段实时堵车时间...</div>
    </div>
    <p id="estDisclaimerText" class="text-[10px] text-gray-400 leading-snug">
      * 预计时间为关卡桥梁与引道车辆通行耗时（不含大楼内人工柜台查验）。
    </p>
  </section>

  <!-- 通道切换 Tab -->
  <section class="mx-3 mt-2.5 grid grid-cols-3 gap-1.5 bg-white p-1.5 rounded-2xl shadow-xs border border-gray-100 text-xs font-bold">
    <button type="button" id="tab-all" onclick="switchCorridor('all')"
            class="corridor-btn py-2 rounded-xl bg-emerald-600 text-white transition">
      全部镜头
    </button>
    <button type="button" id="tab-woodlands" onclick="switchCorridor('woodlands')"
            class="corridor-btn py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-emerald-50 transition">
      兀兰长堤
    </button>
    <button type="button" id="tab-tuas" onclick="switchCorridor('tuas')"
            class="corridor-btn py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-emerald-50 transition">
      大士第二通道
    </button>
  </section>

  <!-- 监控画面列表（支持缩时动态回放 + 放大预览） -->
  <main id="cctvList" class="flex-1 px-3 pt-3 pb-6 space-y-3">
    <div id="loadingCard" class="bg-white rounded-2xl p-8 text-center text-xs text-gray-400 shadow-xs">
      正在获取新马关卡最新路况...
    </div>
  </main>

  <!-- 官方路况与导航快捷入口 -->
  <section id="officialLinksBox" class="mx-3 mb-6 bg-white rounded-2xl p-3.5 shadow-xs border border-gray-100 space-y-2">
    <div id="linksHeader" class="font-black text-xs text-gray-800">🔗 官方路况与导航入口</div>
    <div id="linksContainer" class="space-y-2"></div>
  </section>

  <!-- 高清放大预览弹窗 -->
  <div id="imgPreviewModal" onclick="closeImgPreview()"
       class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col items-center justify-center p-3">
    <button type="button" onclick="closeImgPreview()"
            class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/15 text-white font-bold flex items-center justify-center">
      ✕
    </button>
    <div id="previewTitle" class="text-white text-xs font-bold mb-2 text-center px-8"></div>
    <img id="previewImgEl" src="" onclick="event.stopPropagation()"
         class="max-w-full max-h-[80vh] object-contain rounded-xl shadow-2xl" />
  </div>

  <script>
    const FRAME_HISTORY_KEY = 'dama_cctv_frames_v1';
    const MAX_FRAMES_PER_CAM = 8;

    const TRAFFIC_I18N = {
      zh: {
        backHome: '← 返回首页',
        refresh: '🔄 刷新',
        refreshing: '⏳ 同步中...',
        pageTitle: '🚦 新马关卡实时路况与堵车预计',
        pageSub: '兀兰 & 大士双向预计车程 · 实时关卡抓拍 · 缩时回放',
        rateLabel: '实时参考汇率',
        autoCountdownLabel: '自动检测',
        syncLabel: '最近检测',
        estBoardTitle: '⏱️ 各路段预计通行时间（含当前路况）',
        estSourceLive: 'Google 实时路况',
        estSourceModel: '时段参考预测',
        estDisclaimer: '* 预计时间为关卡桥梁与引道车辆通行耗时（不含大楼内人工柜台查验）。',
        minUnit: '分钟',
        delayLabel: (m) => m > 0 ? `比畅通多堵 +${m} 分钟` : '目前基本畅通',
        levelHeavy: '严重拥堵 🔴',
        levelModerate: '车多缓慢 🟡',
        levelSmooth: '一路畅通 🟢',
        loading: '正在获取新马关卡最新路况...',
        syncFailed: '同步失败',
        timeoutMsg: '路况接口暂时超时，请点击右上角“刷新”再试。',
        tabAll: '全部镜头',
        tabWoodlands: '兀兰长堤',
        tabTuas: '大士第二通道',
        emptyCorridor: '当前通道暂无镜头数据',
        zoomHint: '🔍 点击放大',
        timelapsePlay: '▶️ 车流缩时回放',
        timelapseWait: '⏳ 等待下一帧积累',
        timelapseStop: '⏹️ 停止回放',
        frameCountLabel: (n) => n > 1 ? `已缓存 ${n} 帧 · 可回放` : `已同步最新帧（官方约3–5分更新）`,
        imgFallback: '当前画面暂时无法加载，请点右上角刷新',
        noImg: '暂无最新抓拍画面，请点击右上角“刷新”重试',
        linksHeader: '🔗 官方路况与导航入口'
      },
      en: {
        backHome: '← Home',
        refresh: '🔄 Refresh',
        refreshing: '⏳ Syncing...',
        pageTitle: '🚦 SG-MY Causeway Live & Jam ETA',
        pageSub: '4-Way Bridge Travel Time · Live Cams · Time-Lapse Replay',
        rateLabel: 'Live Exchange Rate',
        autoCountdownLabel: 'Auto Check',
        syncLabel: 'Last Checked',
        estBoardTitle: '⏱️ Estimated Crossing Time by Segment',
        estSourceLive: 'Google Live Traffic',
        estSourceModel: 'Peak-Hour Model',
        estDisclaimer: '* Estimated vehicle travel time across bridge & approach roads (excludes indoor counter queues).',
        minUnit: 'mins',
        delayLabel: (m) => m > 0 ? `+${m} mins delay vs clear` : 'Clear flow right now',
        levelHeavy: 'Heavy Jam 🔴',
        levelModerate: 'Slow / Moderate 🟡',
        levelSmooth: 'Smooth Flow 🟢',
        loading: 'Fetching latest SG-MY checkpoint traffic...',
        syncFailed: 'Sync failed',
        timeoutMsg: 'Traffic feed timed out. Tap Refresh above to try again.',
        tabAll: 'All Cams',
        tabWoodlands: 'Woodlands',
        tabTuas: 'Tuas Link',
        emptyCorridor: 'No camera feeds for this corridor',
        zoomHint: '🔍 Tap to Zoom',
        timelapsePlay: '▶️ Time-Lapse Replay',
        timelapseWait: '⏳ Collecting frames',
        timelapseStop: '⏹️ Stop Replay',
        frameCountLabel: (n) => n > 1 ? `${n} frames cached · Ready` : `Latest frame (LTA updates ~3–5m)`,
        imgFallback: 'Feed temporarily unavailable. Tap Refresh above.',
        noImg: 'No live feed available right now. Tap Refresh to retry.',
        linksHeader: '🔗 Official Traffic & Navigation'
      },
      ms: {
        backHome: '← Utama',
        refresh: '🔄 Muat Semula',
        refreshing: '⏳ Menyegerak...',
        pageTitle: '🚦 Trafik Langsung & Anggaran Masa Tambak',
        pageSub: 'Masa Laluan 4 Arah · Kamera Langsung · Main Semula',
        rateLabel: 'Kadar Tukaran Semasa',
        autoCountdownLabel: 'Semak Auto',
        syncLabel: 'Semakan Terakhir',
        estBoardTitle: '⏱️ Anggaran Masa Perjalanan Mengikut Laluan',
        estSourceLive: 'Trafik Langsung Google',
        estSourceModel: 'Anggaran Waktu Puncak',
        estDisclaimer: '* Anggaran masa kenderaan merentasi jambatan & susur masuk (tidak termasuk barisan kaunter dalam bangunan).',
        minUnit: 'minit',
        delayLabel: (m) => m > 0 ? `Lewat +${m} minit berbanding lancar` : 'Aliran lancar sekarang',
        levelHeavy: 'Sesak Teruk 🔴',
        levelModerate: 'Perlahan / Sederhana 🟡',
        levelSmooth: 'Lancar 🟢',
        loading: 'Memuatkan status trafik pusat pemeriksaan...',
        syncFailed: 'Gagal disegerak',
        timeoutMsg: 'Sambungan trafik tamat masa. Tekan Muat Semula untuk cuba lagi.',
        tabAll: 'Semua Kamera',
        tabWoodlands: 'Woodlands',
        tabTuas: 'Laluan Tuas',
        emptyCorridor: 'Tiada kamera untuk laluan ini',
        zoomHint: '🔍 Tekan untuk Besarkan',
        timelapsePlay: '▶️ Main Semula Trafik',
        timelapseWait: '⏳ Tunggu bingkai baharu',
        timelapseStop: '⏹️ Henti Main',
        frameCountLabel: (n) => n > 1 ? `${n} bingkai disimpan · Sedia` : `Bingkai terkini (kemas kini ~3–5m)`,
        imgFallback: 'Paparan sementara tidak tersedia. Tekan Muat Semula.',
        noImg: 'Tiada paparan tersedia buat masa ini. Tekan Muat Semula.',
        linksHeader: '🔗 Pautan Trafik Rasmi & Navigasi'
      }
    };

    let currentTrafficLang = localStorage.getItem('dama_lang') || 'zh';
    if (!TRAFFIC_I18N[currentTrafficLang]) currentTrafficLang = 'zh';

    let activeCorridor = 'all';
    let latestCameras = [];
    let latestEstimates = [];
    let latestLinks = [];
    let lastSyncedIso = '';
    let countdownSec = 30;
    let activeTimelapseTimers = {};

    function pickLangText(obj, lang = currentTrafficLang) {
      if (!obj) return '';
      if (typeof obj === 'string') return obj;
      return obj[lang] || obj.zh || obj.en || obj.ms || '';
    }

    function renderRouteEstimates() {
      const grid = document.getElementById('routeEstimatesGrid');
      const srcBadge = document.getElementById('estSourceBadge');
      if (!grid) return;
      const t = TRAFFIC_I18N[currentTrafficLang];

      const filtered = activeCorridor === 'all'
        ? latestEstimates
        : latestEstimates.filter(r => r.corridor === activeCorridor);

      if (!filtered.length) return;

      const hasGoogleLive = filtered.some(r => r.source === 'google_live');
      if (srcBadge) {
        srcBadge.textContent = hasGoogleLive ? t.estSourceLive : t.estSourceModel;
      }

      grid.innerHTML = filtered.map(item => {
        const titleText = pickLangText(item.title, currentTrafficLang);
        const segText = pickLangText(item.segment, currentTrafficLang);
        const isHeavy = item.level === 'heavy';
        const isMod = item.level === 'moderate';

        const pillClass = isHeavy
          ? 'bg-rose-100 text-rose-700'
          : (isMod ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800');
        const levelLabel = isHeavy ? t.levelHeavy : (isMod ? t.levelModerate : t.levelSmooth);
        const barColor = isHeavy ? 'bg-rose-500' : (isMod ? 'bg-amber-500' : 'bg-emerald-500');
        const pct = Math.min(100, Math.max(18, Math.round((item.estMins / 60) * 100)));

        return `
          <div class="rounded-xl border border-gray-100 bg-gray-50/70 p-2.5 space-y-1.5">
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="font-black text-xs text-gray-900 truncate">${titleText}</div>
                <div class="text-[10px] text-gray-500 truncate">${segText}</div>
              </div>
              <div class="text-right shrink-0">
                <div class="font-black text-base text-slate-900 leading-none">
                  ${item.estMins} <span class="text-[10px] font-bold text-gray-500">${t.minUnit}</span>
                </div>
                <span class="inline-block mt-1 text-[9px] font-bold px-2 py-0.5 rounded-full ${pillClass}">
                  ${levelLabel}
                </span>
              </div>
            </div>
            <div class="w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
              <div class="h-full ${barColor} rounded-full transition-all duration-500" style="width: ${pct}%"></div>
            </div>
            <div class="flex items-center justify-between text-[10px] text-gray-500 font-medium">
              <span>${t.delayLabel(item.delayMins)}</span>
              <span class="font-mono text-[9px] text-gray-400">${item.direction}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function getFrameStore() {
      try {
        return JSON.parse(localStorage.getItem(FRAME_HISTORY_KEY) || '{}');
      } catch (_) {
        return {};
      }
    }

    function saveCameraFrames(cameras) {
      const store = getFrameStore();
      const bust = Date.now();
      for (const cam of cameras) {
        if (!cam?.id || !cam?.imageUrl) continue;
        const list = Array.isArray(store[cam.id]) ? store[cam.id] : [];
        const cleanUrl = `${cam.imageUrl}${cam.imageUrl.includes('?') ? '&' : '?'}t=${bust}`;
        const lastItem = list[list.length - 1];
        if (!lastItem || lastItem.ts !== cam.timestamp) {
          list.push({ url: cleanUrl, ts: cam.timestamp || new Date().toISOString() });
          store[cam.id] = list.slice(-MAX_FRAMES_PER_CAM);
        }
      }
      try {
        localStorage.setItem(FRAME_HISTORY_KEY, JSON.stringify(store));
      } catch (_) {}
    }

    function stopAllTimelapses() {
      Object.keys(activeTimelapseTimers).forEach(camId => {
        clearInterval(activeTimelapseTimers[camId]);
        delete activeTimelapseTimers[camId];
      });
    }

    function toggleCameraTimelapse(camId) {
      const t = TRAFFIC_I18N[currentTrafficLang];
      const btn = document.getElementById(`tlBtn-${camId}`);
      const imgEl = document.getElementById(`camImg-${camId}`);
      const timeBadge = document.getElementById(`camTime-${camId}`);
      if (!btn || !imgEl) return;

      if (activeTimelapseTimers[camId]) {
        clearInterval(activeTimelapseTimers[camId]);
        delete activeTimelapseTimers[camId];
        btn.textContent = t.timelapsePlay;
        btn.className = 'text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-lg transition';
        return;
      }

      const store = getFrameStore();
      const frames = Array.isArray(store[camId]) ? store[camId] : [];
      if (frames.length < 2) return;

      let idx = 0;
      btn.textContent = t.timelapseStop;
      btn.className = 'text-[10px] font-bold bg-red-600 text-white px-2.5 py-1 rounded-lg transition';

      activeTimelapseTimers[camId] = setInterval(() => {
        const frame = frames[idx % frames.length];
        if (frame) {
          imgEl.src = frame.url;
          if (timeBadge) timeBadge.textContent = `🕒 ${formatTimeShort(frame.ts)}`;
        }
        idx += 1;
      }, 650);
    }

    function setTrafficLang(lang) {
      if (!TRAFFIC_I18N[lang]) return;
      currentTrafficLang = lang;
      localStorage.setItem('dama_lang', lang);
      const t = TRAFFIC_I18N[lang];

      ['zh', 'en', 'ms'].forEach(l => {
        const btn = document.getElementById(`tLang-${l}`);
        if (!btn) return;
        btn.className = l === lang
          ? 'px-2.5 py-0.5 rounded-full bg-white text-emerald-700 transition'
          : 'px-2.5 py-0.5 rounded-full text-white/90 hover:text-white transition';
      });

      document.getElementById('backHomeLink').textContent = t.backHome;
      document.getElementById('refreshBtn').textContent = t.refresh;
      document.getElementById('pageTitle').textContent = t.pageTitle;
      document.getElementById('pageSub').textContent = t.pageSub;
      document.getElementById('rateLabel').textContent = t.rateLabel;
      document.getElementById('autoCountdownLabel').textContent = t.autoCountdownLabel;
      document.getElementById('syncLabel').textContent = t.syncLabel;
      document.getElementById('estBoardTitle').textContent = t.estBoardTitle;
      document.getElementById('estDisclaimerText').textContent = t.estDisclaimer;
      document.getElementById('tab-all').textContent = t.tabAll;
      document.getElementById('tab-woodlands').textContent = t.tabWoodlands;
      document.getElementById('tab-tuas').textContent = t.tabTuas;
      document.getElementById('linksHeader').textContent = t.linksHeader;

      const loadCard = document.getElementById('loadingCard');
      if (loadCard) loadCard.textContent = t.loading;

      if (lastSyncedIso) {
        document.getElementById('lastSyncText').textContent = formatTimeShort(lastSyncedIso);
      }

      renderRouteEstimates();
      renderCameras();
      renderLinks(latestLinks);
    }

    function switchCorridor(corridor) {
      activeCorridor = corridor;
      document.querySelectorAll('.corridor-btn').forEach(btn => {
        const isSel = btn.id === `tab-${corridor}`;
        btn.className = isSel
          ? 'corridor-btn py-2 rounded-xl bg-emerald-600 text-white transition'
          : 'corridor-btn py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-emerald-50 transition';
      });
      renderRouteEstimates();
      renderCameras();
    }

    function formatTimeShort(isoStr) {
      try {
        const d = new Date(isoStr);
        if (Number.isNaN(d.getTime())) return '--:--:--';
        return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (_) {
        return '--:--:--';
      }
    }

    function renderCameras() {
      stopAllTimelapses();
      const box = document.getElementById('cctvList');
      if (!box) return;
      const t = TRAFFIC_I18N[currentTrafficLang];
      const store = getFrameStore();

      const list = activeCorridor === 'all'
        ? latestCameras
        : latestCameras.filter(c => c.corridor === activeCorridor);

      if (!list.length) {
        if (!latestCameras.length) return;
        box.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-xs text-gray-400 shadow-xs">${t.emptyCorridor}</div>`;
        return;
      }

      const bust = Date.now();
      box.innerHTML = list.map(cam => {
        const titleText = pickLangText(cam.title, currentTrafficLang);
        const subText = pickLangText(cam.sub, currentTrafficLang);
        const imgSrc = cam.imageUrl
          ? `${cam.imageUrl}${cam.imageUrl.includes('?') ? '&' : '?'}t=${bust}`
          : '';
        const camTime = formatTimeShort(cam.timestamp);
        const safeTitle = titleText.replace(/'/g, "\\'");
        const cachedCount = Array.isArray(store[cam.id]) ? store[cam.id].length : 1;
        const canReplay = cachedCount >= 2;

        return `
          <div class="bg-white rounded-2xl overflow-hidden shadow-xs border border-gray-100">
            <div class="p-3 border-b border-gray-50 flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="font-black text-xs text-gray-900 truncate">${titleText}</div>
                <div class="text-[11px] text-gray-500 truncate mt-0.5">${subText}</div>
              </div>
              <span id="camTime-${cam.id}" class="text-[10px] font-mono font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full shrink-0">
                🕒 ${camTime}
              </span>
            </div>
            ${imgSrc ? `
              <div onclick="openImgPreview(document.getElementById('camImg-${cam.id}').src, '${safeTitle}')"
                   class="relative aspect-[16/10] w-full bg-slate-900 cursor-zoom-in overflow-hidden">
                <img id="camImg-${cam.id}" src="${imgSrc}" alt="${titleText}" loading="lazy"
                     onerror="this.parentElement.innerHTML='<div class=\\'p-8 text-center text-xs text-gray-400 bg-gray-50\\'>${t.imgFallback}</div>';"
                     class="w-full h-full object-cover transition-opacity duration-200" />
                <span class="absolute top-2 left-2 bg-red-600/90 text-white text-[9px] font-extrabold px-2 py-0.5 rounded-full flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span> LIVE
                </span>
                <span class="absolute bottom-2 right-2 bg-black/65 text-white text-[10px] font-bold px-2 py-1 rounded-full">
                  ${t.zoomHint}
                </span>
              </div>
              <div class="px-3 py-2 bg-gray-50/80 flex items-center justify-between gap-2">
                <span class="text-[10px] text-gray-500 font-medium">${t.frameCountLabel(cachedCount)}</span>
                <button type="button" id="tlBtn-${cam.id}" ${canReplay ? '' : 'disabled'} onclick="toggleCameraTimelapse('${cam.id}')"
                        class="text-[10px] font-bold ${canReplay ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-gray-100 text-gray-400 cursor-not-allowed'} px-2.5 py-1 rounded-lg transition">
                  ${canReplay ? t.timelapsePlay : t.timelapseWait}
                </button>
              </div>
            ` : `
              <div class="p-8 text-center text-xs text-gray-400 bg-gray-50">
                ${t.noImg}
              </div>
            `}
          </div>
        `;
      }).join('');
    }

    function renderLinks(links = []) {
      const container = document.getElementById('linksContainer');
      if (!container || !Array.isArray(links)) return;
      container.innerHTML = links.map(item => {
        const titleText = pickLangText(item.title, currentTrafficLang);
        const descText = pickLangText(item.desc, currentTrafficLang);
        return `
          <a href="${item.url}" ${item.external ? 'target="_blank" rel="noopener noreferrer"' : ''}
             class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-gray-50 hover:bg-emerald-50/70 border border-gray-100 transition">
            <div class="min-w-0">
              <div class="font-bold text-xs text-gray-800 truncate">${titleText}</div>
              <div class="text-[10px] text-gray-500 truncate">${descText}</div>
            </div>
            <span class="text-emerald-600 font-bold text-sm shrink-0">›</span>
          </a>
        `;
      }).join('');
    }

    async function loadTrafficCameras(showSpin = false) {
      const t = TRAFFIC_I18N[currentTrafficLang];
      const btn = document.getElementById('refreshBtn');
      if (showSpin && btn) btn.textContent = t.refreshing;
      countdownSec = 30;

      try {
        const res = await fetch('/api/traffic-cctv');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        latestCameras = Array.isArray(data?.cameras) ? data.cameras : [];
        latestEstimates = Array.isArray(data?.routeEstimates) ? data.routeEstimates : [];
        saveCameraFrames(latestCameras);

        if (Array.isArray(data?.jbLinks)) {
          latestLinks = data.jbLinks;
          renderLinks(latestLinks);
        }
        if (data?.updatedAt) {
          lastSyncedIso = data.updatedAt;
          document.getElementById('lastSyncText').textContent = formatTimeShort(lastSyncedIso);
        }
        renderRouteEstimates();
        renderCameras();
      } catch (err) {
        console.error('Traffic load error:', err);
        document.getElementById('lastSyncText').textContent = t.syncFailed;
        if (!latestCameras.length) {
          document.getElementById('cctvList').innerHTML = `
            <div class="bg-white rounded-2xl p-8 text-center text-xs text-gray-400 shadow-xs">
              ${t.timeoutMsg}
            </div>`;
        }
      } finally {
        if (btn) btn.textContent = t.refresh;
      }
    }

    async function loadSgdRate() {
      try {
        const res = await fetch('https://api.frankfurter.dev/v1/latest?base=MYR&symbols=SGD');
        const json = await res.json();
        if (json?.rates?.SGD) {
          const sgdToMyr = (1 / json.rates.SGD).toFixed(2);
          document.getElementById('sgdRateText').textContent = `1 SGD ≈ ${sgdToMyr} MYR`;
        }
      } catch (_) {}
    }

    function openImgPreview(src, title) {
      document.getElementById('previewImgEl').src = src;
      document.getElementById('previewTitle').textContent = title;
      document.getElementById('imgPreviewModal').classList.remove('hidden');
    }

    function closeImgPreview() {
      document.getElementById('imgPreviewModal').classList.add('hidden');
    }

    setTrafficLang(currentTrafficLang);
    loadSgdRate();
    loadTrafficCameras(true);

    setInterval(() => {
      countdownSec -= 1;
      if (countdownSec <= 0) {
        countdownSec = 30;
        loadTrafficCameras(false);
      }
      const el = document.getElementById('autoCountdownText');
      if (el) el.textContent = `${countdownSec}s`;
    }, 1000);
  </script>
</body>
</html>
