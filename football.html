<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>足坛全明星实时动态 · 大马吉通 MY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 顶部绿茵渐变导航栏 -->
    <header class="bg-gradient-to-r from-emerald-700 via-teal-700 to-green-800 text-white sticky top-0 z-30 shadow-md px-3 py-2.5">
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="flex items-center gap-2 min-w-0">
          <a href="/news.html" id="backNewsLink" class="bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-xl text-xs font-bold shrink-0 transition">← 新闻</a>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-lime-300 animate-ping shrink-0"></span>
              <h1 id="starPageTitle" class="font-black text-sm tracking-tight truncate">足坛全明星动态</h1>
              <span id="syncBadge" class="hidden text-[9px] bg-black/25 px-1.5 py-0.5 rounded-full shrink-0">同步中...</span>
            </div>
            <p id="starPageSub" class="text-[10px] text-emerald-100 truncate">国际巨星 + 马来/大马球星 · 实时聚合</p>
          </div>
        </div>

        <!-- 三语切换器 -->
        <div class="flex items-center bg-black/20 rounded-full p-0.5 text-[11px] font-bold shrink-0">
          <button onclick="switchStarLang('zh')" id="sLang-zh" class="px-2 py-0.5 rounded-full bg-white text-emerald-700 transition">CN</button>
          <button onclick="switchStarLang('en')" id="sLang-en" class="px-2 py-0.5 rounded-full text-white/90 transition">EN</button>
          <button onclick="switchStarLang('ms')" id="sLang-ms" class="px-2 py-0.5 rounded-full text-white/90 transition">BM</button>
        </div>
      </div>

      <!-- 球星专题横向滑动标签栏
