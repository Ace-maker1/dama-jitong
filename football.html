    const LEAGUES = [
      { code: 'eng.1', tag: 'EPL 英超' },
      { code: 'uefa.champions', tag: 'UCL 欧冠' },
      { code: 'esp.1', tag: 'LaLiga 西甲' },
      { code: 'ita.1', tag: 'Serie A 意甲' },
      { code: 'ksa.1', tag: 'Saudi 沙特联' },
      { code: 'usa.1', tag: 'MLS 美职联' }
    ];

    function isSafeExternalUrl(url) {
      return /^https?:\/\//i.test((url || '').trim());
    }

    function formatMytTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleString('en-GB', {
        timeZone: 'Asia/Kuala_Lumpur',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }) + ' MYT';
    }

    async function loadLiveMatches() {
      const row = document.getElementById('liveMatchesRow');
      const t = STAR_I18N[currentStarLang];

      try {
        const results = await Promise.all(LEAGUES.map(async (lg) => {
          try {
            const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg.code}/scoreboard`);
            if (!res.ok) return [];
            const data = await res.json();
            return (data.events || []).map(ev => {
              const comp = ev.competitions?.[0];
              const competitors = comp?.competitors || [];
              const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
              const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
              const state = ev.status?.type?.state || 'pre'; // 'in', 'pre', 'post'
              const detail = ev.status?.type?.shortDetail || '';
              return {
                league: lg.tag,
                date: ev.date,
                state,
                detail,
                homeName: home?.team?.shortDisplayName || home?.team?.name || 'Home',
                homeLogo: home?.team?.logo || '',
                homeScore: home?.score ?? '0',
                awayName: away?.team?.shortDisplayName || away?.team?.name || 'Away',
                awayLogo: away?.team?.logo || '',
                awayScore: away?.score ?? '0'
              };
            });
          } catch (e) {
            return [];
          }
        }));

        const allEvents = results.flat();
        // 优先排正在直播 ('in')，其次未开赛 ('pre')，最后已完场 ('post')
        const orderMap = { in: 0, pre: 1, post: 2 };
        allEvents.sort((a, b) => {
          if (orderMap[a.state] !== orderMap[b.state]) return orderMap[a.state] - orderMap[b.state];
          return new Date(a.date) - new Date(b.date);
        });

        const topMatches = allEvents.slice(0, 12);
        if (topMatches.length === 0) {
          row.innerHTML = `<div class="text-[11px] text-slate-400 py-2">${t.noMatches}</div>`;
          return;
        }

        row.innerHTML = topMatches.map(m => {
          const isLive = m.state === 'in';
          const isPost = m.state === 'post';
          const statusBadge = isLive
            ? `<span class="bg-rose-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded animate-pulse">● LIVE ${m.detail}</span>`
            : isPost
              ? `<span class="bg-slate-700 text-slate-300 text-[9px] font-bold px-1.5 py-0.5 rounded">${t.ftTag}</span>`
              : `<span class="bg-emerald-900/80 text-emerald-300 text-[9px] font-bold px-1.5 py-0.5 rounded">${formatMytTime(m.date)}</span>`;

          const ytQuery = encodeURIComponent(`${m.homeName} vs ${m.awayName} live highlights`);
          const watchUrl = `https://www.youtube.com/results?search_query=${ytQuery}`;

          return `
            <div class="w-56 shrink-0 bg-slate-800/95 border ${isLive ? 'border-rose-500/70' : 'border-slate-700'} rounded-xl p-2.5 flex flex-col justify-between gap-2">
              <div class="flex items-center justify-between gap-1">
                <span class="text-[9px] font-bold text-slate-400 truncate">${m.league}</span>
                ${statusBadge}
              </div>

              <div class="space-y-1.5 my-0.5">
                <div class="flex items-center justify-between gap-2 text-xs">
                  <div class="flex items-center gap-1.5 min-w-0">
                    ${m.homeLogo ? `<img src="${m.homeLogo}" class="w-4 h-4 object-contain shrink-0" />` : ''}
                    <span class="font-bold text-slate-100 truncate">${m.homeName}</span>
                  </div>
                  <span class="font-black text-sm ${isLive ? 'text-rose-400' : 'text-white'}">${m.state === 'pre' ? '-' : m.homeScore}</span>
                </div>

                <div class="flex items-center justify-between gap-2 text-xs">
                  <div class="flex items-center gap-1.5 min-w-0">
                    ${m.awayLogo ? `<img src="${m.awayLogo}" class="w-4 h-4 object-contain shrink-0" />` : ''}
                    <span class="font-bold text-slate-100 truncate">${m.awayName}</span>
                  </div>
                  <span class="font-black text-sm ${isLive ? 'text-rose-400' : 'text-white'}">${m.state === 'pre' ? '-' : m.awayScore}</span>
                </div>
              </div>

              <a href="${watchUrl}" target="_blank" rel="noopener noreferrer"
                 class="block text-center text-[10px] font-bold py-1 rounded-lg ${isLive ? 'bg-rose-600 hover:bg-rose-500 text-white' : 'bg-slate-700 hover:bg-slate-600 text-emerald-300'} transition">
                ${t.watchBtn}
              </a>
            </div>
          `;
        }).join('');
      } catch (e) {
        row.innerHTML = `<div class="text-[11px] text-slate-400 py-2">${t.noMatches}</div>`;
      }
    }

    function switchStarLang(lang) {
      currentStarLang = lang;

      });
      renderStarTabs();
      loadLiveMatches();
      loadStarNews();
    }

      document.getElementById('navMap').innerText = t.navMap;
      document.getElementById('navBiz').innerText = t.navBiz;

      document.getElementById('starTabs').innerHTML = t.stars.map(st => {
        const active = st.id === currentStarId;
        return `
          <button onclick="selectStar('${st.id}')"
                  class="px-3 py-1 rounded-full text-xs font-bold shrink-0 transition ${active ? 'bg-white text-emerald-800 shadow-xs' : 'bg-black/20 text-white/90 hover:bg-black/30'}">
            ${st.label}
          </button>
        `;
      }).join('');
    }

    function timeAgo(dateStr, lang) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      const diffMins = Math.max(1, Math.floor((Date.now() - d.getTime()) / 60000));
      if (diffMins < 60) return lang === 'zh' ? `${diffMins}分钟前` : `${diffMins}m ago`;
      const hrs = Math.floor(diffMins / 60);
      if (hrs < 24) return lang === 'zh' ? `${hrs}小时前` : `${hrs}h ago`;
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function renderSkeleton() {
      return Array(5).fill(0).map(() => `
        <div class="bg-white rounded-2xl p-3.5 border border-gray-100 animate-pulse space-y-2.5">
          <div class="flex gap-2">
            <div class="h-4 w-16 bg-gray-200 rounded"></div>
            <div class="h-4 w-12 bg-gray-100 rounded"></div>
          </div>
          <div class="h-4 w-full bg-gray-200 rounded"></div>
          <div class="h-4 w-3/4 bg-gray-200 rounded"></div>
        </div>
      `).join('');
    }

    function renderStarCards(items, starLabel, readMoreText) {
      const seen = new Set();
      const uniqueItems = items.filter(it => {
        if (!isSafeExternalUrl(it.link)) return false;
        const key = it.title.slice(0, 18);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      return uniqueItems.slice(0, 30).map((item, idx) => `
        <a href="${item.link}" target="_blank" rel="noopener noreferrer"
           class="block bg-white rounded-2xl p-3.5 shadow-2xs border border-gray-100 card-hover">
          <div class="flex justify-between gap-3">
            <div class="flex-1 min-w-0 flex flex-col justify-between">
              <div>
                <div class="flex items-center gap-1.5 mb-1.5">
                  ${idx < 3 ? `<span class="bg-emerald-600 text-white text-[10px] font-black px-1.5 py-0.2 rounded">STAR ${idx + 1}</span>` : ''}
                  <span class="bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded truncate max-w-[160px]">${item.realSource}</span>
                  <span class="text-[11px] text-gray-400 shrink-0">${timeAgo(item.pubDate, currentStarLang)}</span>
                </div>
                <h2 class="font-bold text-gray-900 text-[15px] leading-snug line-clamp-2 mb-2">${item.title}</h2>
              </div>
              <div class="flex items-center justify-between text-[11px]">
                <span class="text-emerald-700 font-semibold">${starLabel}</span>
                <span class="text-emerald-600 font-bold">${readMoreText}</span>
              </div>
            </div>
            ${item.thumbnail ? `<img src="${item.thumbnail}" loading="lazy" onerror="this.style.display='none'" class="w-20 h-20 rounded-xl object-cover shrink-0 border border-gray-100" />` : ''}
          </div>
        </a>
      `).join('');
    }

    async function fetchOneStarFeed(f) {
      const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(f.q)}&hl=${f.hl}&gl=${f.gl}&ceid=${f.ceid}`;
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 7000);
        const res = await fetch(`/api/news?url=${encodeURIComponent(rssUrl)}`, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) return [];
        const text = await res.text();
        const xml = new DOMParser().parseFromString(text, 'text/xml');
        return Array.from(xml.querySelectorAll('item')).slice(0, 6).map(node => {
          const rawTitle = node.querySelector('title')?.textContent?.trim() || '';
          const parts = rawTitle.split(' - ');
          const realMedia = parts.length > 1 ? parts[parts.length - 1].trim() : f.q;
          const cleanTitle = parts.length > 1 ? parts.slice(0, -1).join(' - ') : rawTitle;
          const media = cleanTitle
            ? `https://tse2.mm.bing.net/th?q=${encodeURIComponent(cleanTitle.slice(0, 28))}&w=240&h=240&c=7&rs=1&p=0`
            : '';

          return {
            title: cleanTitle,
            link: node.querySelector('link')?.textContent?.trim() || '',
            pubDate: node.querySelector('pubDate')?.textContent?.trim() || '',
            thumbnail: media,
            realSource: realMedia
          };
        }).filter(x => x.title && x.link);
      } catch (e) {
        return [];
      }
    }

    async function loadStarNews() {
      const reqId = ++activeStarReq;
      const t = STAR_I18N[currentStarLang];
      const starObj = t.stars.find(s => s.id === currentStarId) || t.stars[0];
      const box = document.getElementById('starNewsContainer');
      const syncBadge = document.getElementById('syncBadge');
      const cacheKey = `dmjt_star_v4_${currentStarLang}_${starObj.id}`;

      let hasCache = false;
      try {
        const cachedRaw = localStorage.getItem(cacheKey);
        if (cachedRaw) {
          const cachedItems = JSON.parse(cachedRaw);
          if (Array.isArray(cachedItems) && cachedItems.length > 0) {
            box.innerHTML = renderStarCards(cachedItems, starObj.label, t.readMore);
            hasCache = true;
          }
        }
      } catch (e) {}

      if (!hasCache) box.innerHTML = renderSkeleton();
      syncBadge.classList.remove('hidden');

      let collected = [];
      await Promise.all(starObj.feeds.map(async (f) => {
        const list = await fetchOneStarFeed(f);
        if (reqId !== activeStarReq || list.length === 0) return;

        collected = collected.concat(list);
        collected.sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));
        box.innerHTML = renderStarCards(collected, starObj.label, t.readMore);
        try { localStorage.setItem(cacheKey, JSON.stringify(collected.slice(0, 30))); } catch (e) {}
      }));

      if (reqId !== activeStarReq) return;
      syncBadge.classList.add('hidden');

      if (collected.length === 0 && !hasCache) {
        box.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center space-y-3 border border-gray-100"><div class="text-gray-400 text-sm">${t.empty}</div><button onclick="loadStarNews()" class="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-full">${t.retry}</button></div>`;
      }
    }

    switchStarLang(currentStarLang);
  </script>
</body>
</html>
