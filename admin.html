<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大马吉通 MY - 独立管理控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- 登录验证锁屏 -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white max-w-sm w-full rounded-2xl p-6 shadow-lg border border-gray-100">
      <div class="flex items-center space-x-2.5 mb-5">
        <div class="w-10 h-10 bg-red-600 text-white rounded-xl flex items-center justify-center font-black text-xl">吉</div>
        <div>
          <h1 class="font-extrabold text-gray-900 text-lg">大马吉通 · 后台管理</h1>
          <p class="text-xs text-gray-400">仅限平台管理员访问</p>
        </div>
      </div>
      <form onsubmit="verifyLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1.5">管理密码</label>
          <input type="password" id="adminPwdInput" required placeholder="请输入管理员密码" 
                 class="w-full border border-gray-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-red-500">
        </div>
        <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 transition shadow">
          进入管理控制台
        </button>
      </form>
    </div>
  </div>

  <!-- 后台管理主界面 -->
  <div id="dashboardScreen" class="hidden max-w-4xl mx-auto p-4 pb-16">
    <!-- 顶部栏 -->
    <header class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-wrap items-center justify-between gap-3 mb-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-red-600 text-white rounded-xl flex items-center justify-center font-black text-xl">吉</div>
        <div>
          <h1 class="font-extrabold text-gray-900 text-base">大马吉通 MY · 运营总控台</h1>
          <p class="text-xs text-green-600 font-medium">● 已安全登录并连接云端数据库</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <a href="index.html" target="_blank" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-3.5 py-2 rounded-xl transition">
          ↗ 查看前台网页
        </a>
        <button onclick="logout()" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 font-bold px-3.5 py-2 rounded-xl transition">
          退出登录
        </button>
      </div>
    </header>

    <!-- 数据概览 -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div class="text-xs text-gray-400 mb-1">全站总帖数</div>
        <div id="statTotal" class="text-2xl font-black text-gray-800">0</div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div class="text-xs text-gray-400 mb-1">置顶广告位</div>
        <div id="statPinned" class="text-2xl font-black text-red-600">0</div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div class="text-xs text-gray-400 mb-1">带实拍图帖</div>
        <div id="statImages" class="text-2xl font-black text-blue-600">0</div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div class="text-xs text-gray-400 mb-1">今日新增</div>
        <div id="statToday" class="text-2xl font-black text-emerald-600">0</div>
      </div>
    </div>

    <!-- 搜索与筛选 -->
    <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-gray-100 mb-4 flex flex-wrap gap-2.5">
      <input type="text" id="adminSearch" oninput="renderAdminList()" placeholder="搜索标题、手机号、城市..." 
             class="flex-1 min-w-[200px] border border-gray-200 bg-gray-50 rounded-xl px-3.5 py-2 text-sm focus:outline-none">
      <select id="adminCatFilter" onchange="renderAdminList()" class="border border-gray-200 bg-gray-50 rounded-xl px-3 py-2 text-sm">
        <option value="全部">全部分类</option>
        <option value="找房子">找房子</option>
        <option value="找工作">找工作</option>
        <option value="二手闲置">二手闲置</option>
        <option value="本地优惠">本地商家</option>
      </select>
      <button onclick="loadAdminPosts()" class="bg-gray-800 text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-gray-700">
        🔄 刷新数据
      </button>
    </div>

    <!-- 内容管理列表 -->
    <div id="adminPostList" class="space-y-3">
      <div class="text-center py-12 text-gray-400 text-sm">正在加载数据...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uhgukdqggvyaepkvlugg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_mJ6eEsaqtRcuikGbQiUEPQ_-tLIRrHU';
    const ADMIN_PASSCODE = 'damajitong9692';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let postsData = [];

    // 检查当前标签页是否已登录
    if (sessionStorage.getItem('dama_admin_auth') === 'true') {
      showDashboard();
    }

    function verifyLogin(e) {
      e.preventDefault();
      const val = document.getElementById('adminPwdInput').value;
      if (val === ADMIN_PASSCODE) {
        sessionStorage.setItem('dama_admin_auth', 'true');
        showDashboard();
      } else {
        alert('❌ 管理密码错误！');
      }
    }

    function logout() {
      sessionStorage.removeItem('dama_admin_auth');
      location.reload();
    }

    function showDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboardScreen').classList.remove('hidden');
      loadAdminPosts();
    }

    async function loadAdminPosts() {
      const { data, error } = await supabaseClient
        .from('posts')
        .select('*')
        .order('is_pinned', { ascending: false })
        .order('created_at', { ascending: false });

      if (error) {
        alert('加载失败：' + error.message);
        return;
      }
      postsData = data || [];
      updateStats();
      renderAdminList();
    }

    function updateStats() {
      const todayStr = new Date().toDateString();
      document.getElementById('statTotal').innerText = postsData.length;
      document.getElementById('statPinned').innerText = postsData.filter(p => p.is_pinned).length;
      document.getElementById('statImages').innerText = postsData.filter(p => p.image_url).length;
      document.getElementById('statToday').innerText = postsData.filter(p => new Date(p.created_at).toDateString() === todayStr).length;
    }

    function renderAdminList() {
      const kw = document.getElementById('adminSearch').value.trim().toLowerCase();
      const cat = document.getElementById('adminCatFilter').value;
      const container = document.getElementById('adminPostList');

      const filtered = postsData.filter(p => {
        const matchCat = cat === '全部' || p.category === cat;
        const matchKw = !kw || p.title.toLowerCase().includes(kw) || p.city.toLowerCase().includes(kw) || (p.whatsapp && p.whatsapp.includes(kw));
        return matchCat && matchKw;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-10 text-center text-gray-400 text-sm">没有匹配的帖子记录</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => {
        const timeStr = new Date(p.created_at).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border ${p.is_pinned ? 'border-red-300 bg-red-50/15' : 'border-gray-100'} flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-start space-x-3 min-w-0">
              ${p.image_url 
                ? `<img src="${p.image_url}" class="w-16 h-16 rounded-xl object-cover shrink-0 border border-gray-200" />` 
                : `<div class="w-16 h-16 rounded-xl bg-gray-100 text-gray-400 flex items-center justify-center text-xs shrink-0">无图</div>`
              }
              <div class="min-w-0">
                <div class="flex items-center flex-wrap gap-1.5 mb-1">
                  <span class="text-[11px] text-gray-400 font-mono">#${p.id}</span>
                  ${p.is_pinned ? '<span class="bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">置顶广告</span>' : ''}
                  <span class="bg-blue-50 text-blue-600 text-[10px] font-bold px-2 py-0.5 rounded">${p.category}</span>
                  <span class="text-xs text-gray-500">📍 ${p.city}</span>
                  <span class="text-xs text-gray-400">· ${timeStr}</span>
                </div>
                <h3 class="font-bold text-gray-900 text-sm truncate">${p.title}</h3>
                <div class="text-xs text-gray-500 mt-1">
                  价格：<span class="text-red-600 font-bold">${p.price}</span> · 联系：<span class="font-mono">${p.whatsapp}</span>
                </div>
              </div>
            </div>
            <div class="flex items-center space-x-2 shrink-0 self-end sm:self-center">
              <button onclick="togglePin(${p.id}, ${p.is_pinned})" class="px-3 py-2 rounded-xl text-xs font-bold transition ${p.is_pinned ? 'bg-gray-200 text-gray-700 hover:bg-gray-300' : 'bg-amber-100 text-amber-800 hover:bg-amber-200'}">
                ${p.is_pinned ? '取消置顶' : '⬆️ 设为置顶'}
              </button>
              <button onclick="deletePost(${p.id})" class="px-3 py-2 rounded-xl text-xs font-bold bg-red-100 text-red-700 hover:bg-red-200 transition">
                🗑️ 删除
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function togglePin(id, current) {
      const { error } = await supabaseClient.from('posts').update({ is_pinned: !current }).eq('id', id);
      if (!error) loadAdminPosts();
    }

    async function deletePost(id) {
      if (!confirm(`确定要永久删除 ID #${id} 这条帖子吗？`)) return;
      const { error } = await supabaseClient.from('posts').delete().eq('id', id);
      if (!error) loadAdminPosts();
    }
  </script>
</body>
</html>
