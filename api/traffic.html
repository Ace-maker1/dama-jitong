<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新马关卡实时 CCTV - 大马吉通 DamaJitong</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #eef0f4;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="max-w-md mx-auto bg-[#f5f6f8] min-h-screen flex flex-col shadow-[0_0_40px_rgba(15,23,42,0.12)]">

  <!-- 顶部栏 -->
  <header class="bg-gradient-to-br from-emerald-600 via-teal-600 to-cyan-700 text-white px-4 pt-4 pb-5 rounded-b-[24px] shadow-md">
    <div class="flex items-center justify-between gap-2 mb-3">
      <a href="/index.html" class="text-xs font-bold bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">
        ← 返回首页
      </a>
      <button type="button" id="refreshBtn" onclick="loadTrafficCameras(true)"
              class="text-xs font-bold bg-white text-emerald-700 hover:bg-emerald-50 px-3 py-1.5 rounded-full shadow-xs transition">
        🔄 立即刷新
      </button>
    </div>
    <h1 class="font-black text-lg tracking-tight">🚦 新马关卡实时路况 CCTV</h1>
    <p class="text-[11px] text-emerald-100 mt-0.5">
      兀兰长堤 Woodlands · 大士第二通道 Tuas · 每 60 秒自动更新
    </p>
  </header>

  <!-- 汇率与刷新状态条 -->
  <section class="mx-3 -mt-3 bg-white rounded-2xl p-3 shadow-xs border border-gray-100 flex items-center justify-between gap-2 text-xs">
    <div>
      <div class="text-[10px] text-gray-400">实时参考汇率</div>
      <div id="sgdRateText" class="font-black text-blue-600">1 SGD ≈ 3.19 MYR</div>
    </div>
    <div class="text-right">
      <div class="text-[10px] text-gray-400">最近同步时间</div>
      <div id="lastSyncText" class="font-bold text-gray-700">加载中...</div>
    </div>
  </section>

  <!-- 通道切换 Tab -->
  <section class="mx-3 mt-3 grid grid-cols-3 gap-1.5 bg-white p-1.5 rounded-2xl shadow-xs border border-gray-100 text-xs font-bold">
    <button type="button" id="tab-all" onclick="switchCorridor('all')"
            class="corridor-btn py-2 rounded-xl bg-emerald-600 text-white transition">
      全部镜头
    </button>
    <button type="button" id="tab-woodlands" onclick="switchCorridor('woodlands')"
            class="corridor-btn py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-emerald-50 transition">
      兀兰长堤
    </button>
    <button type="button" id="tab-tuas" onclick="switchCorridor('tuas')"
            class="corridor-btn py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-emerald-50 transition">
      大士第二通道
    </button>
  </section>

  <!-- CCTV 画面列表 -->
  <main id="cctvList" class="flex-1 px-3 pt-3 pb-6 space-y-3">
    <div class="bg-white rounded-2xl p-8 text-center text-xs text-gray-400 shadow-xs">
      正在获取新马关卡最新路况抓拍...
    </div>
  </main>

  <!-- 柔佛/新加坡官方路况与导航快捷入口 -->
  <section id="officialLinksBox" class="mx-3 mb-6 bg-white rounded-2xl p-3.5 shadow-xs border border-gray-100 space-y-2">
    <div class="font-black text-xs text-gray-800">🔗 补充路况与导航入口</div>
    <div id="linksContainer" class="space-y-2"></div>
  </section>

  <!-- 图片放大预览弹窗 -->
  <div id="imgPreviewModal" onclick="closeImgPreview()"
       class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col items-center justify-center p-3">
    <button type="button" onclick="closeImgPreview()"
            class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/15 text-white font-bold flex items-center justify-center">
      ✕
    </button>
    <div id="previewTitle" class="text-white text-xs font-bold mb-2 text-center px-8"></div>
    <img id="previewImgEl" src="" onclick="event.stopPropagation()"
         class="max-w-full max-h-[80vh] object-contain rounded-xl shadow-2xl" />
  </div>

  <script>
    let activeCorridor = 'all';
    let latestCameras = [];
    let autoRefreshTimer = null;

    function switchCorridor(corridor) {
      activeCorridor = corridor;
      document.querySelectorAll('.corridor-btn').forEach(btn => {
        const isSel = btn.id === `tab-${corridor}`;
        btn.className = isSel
          ? 'corridor-btn py-2 rounded-xl bg-emerald-600 text-white transition'
          : 'corridor-btn py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-emerald-50 transition';
      });
      renderCameras();
    }

    function formatTimeShort(isoStr) {
      try {
        const d = new Date(isoStr);
        if (Number.isNaN(d.getTime())) return '--:--';
        return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (_) {
        return '--:--';
      }
    }

    function renderCameras() {
      const box = document.getElementById('cctvList');
      if (!box) return;

      const list = activeCorridor === 'all'
        ? latestCameras
        : latestCameras.filter(c => c.corridor === activeCorridor);

      if (!list.length) {
        box.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-xs text-gray-400 shadow-xs">当前通道暂无镜头数据</div>`;
        return;
      }

      const bust = Date.now();
      box.innerHTML = list.map(cam => {
        const imgSrc = cam.imageUrl
          ? `${cam.imageUrl}${cam.imageUrl.includes('?') ? '&' : '?'}t=${bust}`
          : '';
        const camTime = formatTimeShort(cam.timestamp);

        return `
          <div class="bg-white rounded-2xl overflow-hidden shadow-xs border border-gray-100">
            <div class="p-3 border-b border-gray-50 flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="font-black text-xs text-gray-900 truncate">${cam.title}</div>
                <div class="text-[11px] text-gray-500 truncate mt-0.5">${cam.sub || ''}</div>
              </div>
              <span class="text-[10px] font-mono font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full shrink-0">
                🕒 ${camTime}
              </span>
            </div>
            ${imgSrc ? `
              <div onclick="openImgPreview('${imgSrc}', '${cam.title.replace(/'/g, "\\'")}')"
                   class="relative aspect-[16/10] w-full bg-slate-900 cursor-zoom-in overflow-hidden">
                <img src="${imgSrc}" alt="${cam.title}" loading="lazy"
                     onerror="this.parentElement.innerHTML='<div class=\\'p-8 text-center text-xs text-gray-400 bg-gray-50\\'>当前镜头快照暂时无法加载，请点右上角立即刷新</div>';"
                     class="w-full h-full object-cover" />
                <span class="absolute bottom-2 right-2 bg-black/65 text-white text-[10px] font-bold px-2 py-1 rounded-full">
                  🔍 点击放大
                </span>
              </div>
            ` : `
              <div class="p-8 text-center text-xs text-gray-400 bg-gray-50">
                暂无实时抓拍图像，请点击右上角“立即刷新”重试
              </div>
            `}
          </div>
        `;
      }).join('');
    }

    function renderLinks(links = []) {
      const container = document.getElementById('linksContainer');
      if (!container) return;
      container.innerHTML = links.map(item => `
        <a href="${item.url}" ${item.url.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''}
           class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-gray-50 hover:bg-emerald-50/70 border border-gray-100 transition">
          <div class="min-w-0">
            <div class="font-bold text-xs text-gray-800 truncate">${item.name}</div>
            <div class="text-[10px] text-gray-500 truncate">${item.desc}</div>
          </div>
          <span class="text-emerald-600 font-bold text-sm shrink-0">›</span>
        </a>
      `).join('');
    }

    async function loadTrafficCameras(showSpin = false) {
      const btn = document.getElementById('refreshBtn');
      if (showSpin && btn) btn.innerText = '⏳ 刷新中...';

      try {
        const res = await fetch('/api/traffic-cctv');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        latestCameras = Array.isArray(data?.cameras) ? data.cameras : [];
        if (data?.updatedAt) {
          document.getElementById('lastSyncText').textContent = formatTimeShort(data.updatedAt);
        }
        if (Array.isArray(data?.jbLinks)) {
          renderLinks(data.jbLinks);
        }
        renderCameras();
      } catch (err) {
        console.error('Traffic load error:', err);
        document.getElementById('lastSyncText').textContent = '同步失败';
        if (!latestCameras.length) {
          document.getElementById('cctvList').innerHTML = `
            <div class="bg-white rounded-2xl p-8 text-center text-xs text-gray-400 shadow-xs">
              路况接口暂时超时，请点击右上角“立即刷新”再试。
            </div>`;
        }
      } finally {
        if (btn) btn.innerText = '🔄 立即刷新';
      }
    }

    async function loadSgdRate() {
      try {
        const res = await fetch('https://api.frankfurter.dev/v1/latest?base=MYR&symbols=SGD');
        const json = await res.json();
        if (json?.rates?.SGD) {
          const sgdToMyr = (1 / json.rates.SGD).toFixed(2);
          document.getElementById('sgdRateText').textContent = `1 SGD ≈ ${sgdToMyr} MYR`;
        }
      } catch (_) {}
    }

    function openImgPreview(src, title) {
      document.getElementById('previewImgEl').src = src;
      document.getElementById('previewTitle').textContent = title;
      document.getElementById('imgPreviewModal').classList.remove('hidden');
    }

    function closeImgPreview() {
      document.getElementById('imgPreviewModal').classList.add('hidden');
    }

    loadSgdRate();
    loadTrafficCameras(true);
    autoRefreshTimer = setInterval(() => loadTrafficCameras(false), 60000);
  </script>
</body>
</html>
