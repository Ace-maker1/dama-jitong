        const pool = (SEED_MERCHANTS_DB[cityVal] || []).filter(m => typeVal === 'all' || m.type === typeVal);
        if (pool.length === 0) {
          logMsg('该地区该行业暂无内置样本，请切换其他地区或“全部行业精选”。', true);
          return;
        }

        const { data: existingPosts } = await supabaseClient
          .from('posts')
          .select('title')
          .eq('city', cityVal)
          .limit(200);
        const existingTitles = new Set((existingPosts || []).map(p => p.title));

        const rowsToInsert = [];
        for (const item of pool) {
          if (rowsToInsert.length >= limit) break;
          const titleZh = `【收录商户·${item.tag}】${item.name}`;
          if (existingTitles.has(titleZh)) continue;
          existingTitles.add(titleZh);

          const tagMap = TAG_TRILINGUAL[item.tag] || { en: 'Local Biz', ms: 'Perniagaan' };
          const titleEn = `[Verified · ${tagMap.en}] ${item.enName}`;
          const titleMs = `[Berdaftar · ${tagMap.ms}] ${item.msName}`;

          rowsToInsert.push({
            category: '本地优惠',
            city: cityVal,
            title: titleZh,
            title_zh: titleZh,
            title_en: titleEn,
            title_ms: titleMs,
            price: item.price,
            price_zh: item.price,
            price_en: item.enPrice,
            price_ms: item.msPrice,
            whatsapp: item.phone,
            description: `📍 门店地址：${item.addr}\n🕒 营业时间：${item.hours}`,
            desc_zh: `📍 门店地址：${item.addr}\n🕒 营业时间：${item.hours}`,
            desc_en: `📍 Address: ${item.addr}\n🕒 Hours: ${item.hours}`,
            desc_ms: `📍 Alamat: ${item.addr}\n🕒 Waktu Operasi: ${item.hours}`,
            image_url: null,
            is_pinned: false
          });
        }

        if (rowsToInsert.length === 0) {
          logMsg(`${cityVal} 这批精选商户已经全部导入过了，去首页看看吧！`);
          return;
        }

        const { error } = await supabaseClient.from('posts').insert(rowsToInsert);
        if (error) throw error;

        logMsg(`🎉 成功写入 ${rowsToInsert.length} 条 ${cityVal} 完整三语商户（CN/EN/BM 秒切）！`);
      } catch (err) {
        logMsg('写入出错：' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerText = '⚡ 一键写入三语商户到首页（7天有效期）';
      }
    }

    async function upgradeExistingPosts() {
      const btn = document.getElementById('upgradeOldBtn');
      btn.disabled = true;
      btn.innerText = '⏳ 正在为现有帖子补全三语字段...';

      try {
        const { data: posts, error } = await supabaseClient.from('posts').select('*').limit(100);
        if (error) throw error;
        if (!posts || posts.length === 0) {
          logMsg('数据库暂无帖子需要升级。');
          return;
        }

        let updatedCount = 0;
        for (const p of posts) {
          if (p.title_en && p.title_ms) continue;

          // 先尝试从内置库精准匹配
          let matched = null;
          for (const list of Object.values(SEED_MERCHANTS_DB)) {
            matched = list.find(m => p.title && p.title.includes(m.name));
            if (matched) break;
          }

          let titleEn = p.title_en;
          let titleMs = p.title_ms;
          let priceEn = p.price_en || p.price;
          let priceMs = p.price_ms || p.price;

          if (matched) {
            const tagMap = TAG_TRILINGUAL[matched.tag] || { en: 'Local Biz', ms: 'Perniagaan' };
            titleEn = `[Verified · ${tagMap.en}] ${matched.enName}`;
            titleMs = `[Berdaftar · ${tagMap.ms}] ${matched.msName}`;
            priceEn = matched.enPrice;
            priceMs = matched.msPrice;
          } else {
            try {
              const rEn = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent((p.title || '').replace(/【/g, '[').replace(/】/g, '] '))}`);
              const jEn = await rEn.json();
              titleEn = (jEn[0] || []).map(x => x[0]).join('').trim() || p.title;

              const rMs = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ms&dt=t&q=${encodeURIComponent((p.title || '').replace(/【/g, '[').replace(/】/g, '] '))}`);
              const jMs = await rMs.json();
              titleMs = (jMs[0] || []).map(x => x[0]).join('').trim() || p.title;
            } catch (e) {}
          }

          const { error: upErr } = await supabaseClient
            .from('posts')
            .update({
              title_zh: p.title_zh || p.title,
              title_en: titleEn || p.title,
              title_ms: titleMs || p.title,
              price_zh: p.price_zh || p.price,
              price_en: priceEn || p.price,
              price_ms: priceMs || p.price
            })
            .eq('id', p.id);

          if (!upErr) updatedCount++;
        }

        logMsg(`✅ 升级完成！共为 ${updatedCount} 条历史帖子补全了 EN / BM 三语字段。`);
      } catch (err) {
        logMsg('升级出错：' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerText = '🔄 一键把现有老帖子补全三语字段（修复历史中文残留）';
      }
    }
  </script>
