    function updateAvailableCount() {
      const cityVal = document.getElementById('seedArea').value;
      const typeVal = document.getElementById('seedType').value;
      const pool = (SEED_MERCHANTS_DB[cityVal] || []).filter(m => typeVal === 'all' || m.type === typeVal);
      logMsg(`${cityVal} 当前可选 [${typeVal === 'all' ? '全部行业' : typeVal}] 精选商户共 ${pool.length} 条。`);
    }

    async function runSeedImport() {
      const btn = document.getElementById('runSeedBtn');
      btn.disabled = true;
      btn.innerText = '⏳ 正在写入云端...';

      try {
        const cityVal = document.getElementById('seedArea').value;
        const typeVal = document.getElementById('seedType').value;
        const limit = parseInt(document.getElementById('seedLimit').value, 10);

        const pool = (SEED_MERCHANTS_DB[cityVal] || []).filter(m => typeVal === 'all' || m.type === typeVal);
        if (pool.length === 0) {
          logMsg('该地区该行业暂无内置样本，请切换为“全部行业精选”或其他地区。', true);
          return;
        }

        const { data: existingPosts } = await supabaseClient
          .from('posts')
          .select('title')
          .eq('city', cityVal)
          .limit(200);
        const existingTitles = new Set((existingPosts || []).map(p => p.title));

        const rowsToInsert = [];
        for (const item of pool) {
          if (rowsToInsert.length >= limit) break;
          const title = `【收录商户·${item.tag}】${item.name}`;
          if (existingTitles.has(title)) continue;
          existingTitles.add(title);

          rowsToInsert.push({
            category: '本地优惠',
            city: cityVal,
            title,
            price: item.price,
            whatsapp: item.phone,
            description: `📍 门店地址：${item.addr}\n🕒 营业时间：${item.hours}\n💡 本信息为全马本地黄页收录展示（7天有效），如您是店主欢迎前往「我的 -> 商家入驻」免费认领并上传门头照！`,
            image_url: null,
            is_pinned: false
          });
        }

        if (rowsToInsert.length === 0) {
          logMsg(`${cityVal} 这批精选商户已经全部导入过了，去首页看看吧！`);
          return;
        }

        const { error } = await supabaseClient.from('posts').insert(rowsToInsert);
        if (error) throw error;

        logMsg(`🎉 成功写入 ${rowsToInsert.length} 条 ${cityVal} 真实商户到首页（7天有效倒计时已生效）！`);
      } catch (err) {
        logMsg('写入出错：' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerText = '⚡ 一键写入首页（7天有效期）';
      }
    }
