<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>大马·新加坡·国际实时头条 · 大马吉通 MY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 顶部红色新闻渐变导航栏 -->
    <header class="bg-gradient-to-r from-red-600 to-orange-600 text-white sticky top-0 z-30 shadow-md px-3.5 py-3">
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <div class="flex items-center gap-2">
          <a href="/" class="bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-xl text-xs font-bold transition">← 首页</a>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-300 animate-ping"></span>
              <h1 id="newsPageTitle" class="font-black text-sm tracking-tight">实时新闻头条</h1>
            </div>
            <p id="newsPageSub" class="text-[10px] text-white/85">大马 · 新加坡 · 投资财经 · 全球实时同步</p>
          </div>
        </div>

        <!-- 三语切换器 -->
        <div class="flex items-center bg-black/20 rounded-full p-0.5 text-[11px] font-bold shrink-0">
          <button onclick="switchNewsLang('zh')" id="nLang-zh" class="px-2 py-0.5 rounded-full bg-white text-red-600 transition">CN</button>
          <button onclick="switchNewsLang('en')" id="nLang-en" class="px-2 py-0.5 rounded-full text-white/90 transition">EN</button>
          <button onclick="switchNewsLang('ms')" id="nLang-ms" class="px-2 py-0.5 rounded-full text-white/90 transition">BM</button>
        </div>
      </div>

      <!-- 新闻频道横向滑动标签栏 -->
      <div id="topicTabs" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5"></div>
    </header>

    <!-- 新闻列表主体 -->
    <main class="flex-1 p-3 space-y-2.5" id="newsContainer">
      <div class="text-center py-20 text-gray-400 text-sm">正在同步全网最新头条...</div>
    </main>

    <!-- 底部5键导航栏 -->
    <nav class="fixed bottom-0 max-w-md w-full bg-white border-t border-gray-200 grid grid-cols-5 items-center py-1.5 z-30 shadow-[0_-2px_10px_rgba(0,0,0,0.03)]">
      <a href="/" class="flex flex-col items-center text-gray-400 hover:text-red-600">
        <span class="text-lg">🏠</span>
        <span id="navHome" class="text-[10px] font-medium mt-0.5">首页</span>
      </a>
      <a href="/news.html" class="flex flex-col items-center text-red-600">
        <span class="text-lg">📰</span>
        <span id="navNews" class="text-[10px] font-bold mt-0.5">实时新闻</span>
      </a>
      <a href="/" class="flex flex-col items-center -mt-6">
        <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-red-600 to-orange-500 text-white flex items-center justify-center text-2xl shadow-lg border-4 border-white">+</div>
        <span id="navPost" class="text-[10px] font-bold text-gray-700 mt-0.5">发布</span>
      </a>
      <a href="/map.html" class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
        <span class="text-lg">🧭</span>
        <span id="navMap" class="text-[10px] font-medium mt-0.5">查路线</span>
      </a>
      <a href="/merchant.html" class="flex flex-col items-center text-gray-400 hover:text-amber-600">
        <span class="text-lg">🏪</span>
        <span id="navBiz" class="text-[10px] font-medium mt-0.5">商家入驻</span>
      </a>
    </nav>
  </div>

  <script>
    // 高可用官方媒体直连 RSS 源（按语言与频道精准匹配，100% 稳定秒出）
    const NEWS_I18N = {
      zh: {
        title: '实时新闻头条',
        sub: '大马 · 新加坡 · 投资财经 · 全球实时同步',
        loading: '正在同步最新实时新闻...',
        empty: '网络波动，请点击下方按钮重新拉取',
        retry: '↻ 重新加载新闻',
        readMore: '阅读全文 ↗',
        navHome: '首页', navNews: '实时新闻', navPost: '发布', navMap: '查路线', navBiz: '商家入驻',
        topics: [
          {
            id: 'my',
            label: '🇲🇾 马来西亚',
            feeds: [
              { name: '东方日报 Oriental Daily', url: 'https://www.orientaldaily.com.my/feed' },
              { name: '光华日报 Kwong Wah', url: 'https://www.kwongwah.com.my/feed/' }
            ]
          },
          {
            id: 'sg',
            label: '🇸🇬 新加坡',
            feeds: [
              { name: '8视界新闻网', url: 'https://www.8world.com/rss/singapore' },
              { name: 'BBC 中文网', url: 'https://feeds.bbci.co.uk/zhongwen/simp/rss.xml' }
            ]
          },
          {
            id: 'finance',
            label: '📈 投资财经',
            feeds: [
              { name: '东方财经', url: 'https://www.orientaldaily.com.my/feed/business' },
              { name: 'BBC 财经', url: 'https://feeds.bbci.co.uk/zhongwen/simp/business/rss.xml' }
            ]
          },
          {
            id: 'life',
            label: '🍜 生活娱乐',
            feeds: [
              { name: '东方生活娱乐', url: 'https://www.orientaldaily.com.my/feed/lifestyle' },
              { name: '光华副刊生活', url: 'https://www.kwongwah.com.my/category/%e5%89%af%e5%88%8a/feed/' }
            ]
          },
          {
            id: 'world',
            label: '🌍 国际要闻',
            feeds: [
              { name: 'BBC 国际头条', url: 'https://feeds.bbci.co.uk/zhongwen/simp/world/rss.xml' },
              { name: '东方国际', url: 'https://www.orientaldaily.com.my/feed/international' }
            ]
          }
        ]
      },
      en: {
        title: 'Live News Feed',
        sub: 'Malaysia · Singapore · Finance · World Updates',
        loading: 'Fetching latest headlines...',
        empty: 'Network busy, tap below to reload',
        retry: '↻ Reload Headlines',
        readMore: 'Read Full Story ↗',
        navHome: 'Home', navNews: 'News', navPost: 'Post', navMap: 'Navigate', navBiz: 'Merchants',
        topics: [
          {
            id: 'my',
            label: '🇲🇾 Malaysia',
            feeds: [
              { name: 'Malay Mail MY', url: 'https://www.malaymail.com/feed/rss/malaysia' },
              { name: 'Free Malaysia Today', url: 'https://www.freemalaysiatoday.com/category/nation/feed/' }
            ]
          },
          {
            id: 'sg',
            label: '🇸🇬 Singapore',
            feeds: [
              { name: 'CNA Singapore', url: 'https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml&category=10416' },
              { name: 'CNA Asia', url: 'https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml&category=6511' }
            ]
          },
          {
            id: 'finance',
            label: '📈 Finance & Invest',
            feeds: [
              { name: 'Malay Mail Money', url: 'https://www.malaymail.com/feed/rss/money' },
              { name: 'CNA Business', url: 'https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml&category=6936' }
            ]
          },
          {
            id: 'life',
            label: '🍜 Lifestyle',
            feeds: [
              { name: 'Malay Mail Life', url: 'https://www.malaymail.com/feed/rss/life' },
              { name: 'FMT Lifestyle', url: 'https://www.freemalaysiatoday.com/category/leisure/feed/' }
            ]
          },
          {
            id: 'world',
            label: '🌍 World',
            feeds: [
              { name: 'BBC World', url: 'https://feeds.bbci.co.uk/news/world/rss.xml' },
              { name: 'CNA World', url: 'https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml&category=6311' }
            ]
          }
        ]
      },
      ms: {
        title: 'Berita Terkini',
        sub: 'Malaysia · Singapura · Pelaburan · Dunia',
        loading: 'Memuatkan berita terkini...',
        empty: 'Rangkaian sibuk, tekan butang di bawah untuk cuba lagi',
        retry: '↻ Muat Semula',
        readMore: 'Baca Penuh ↗',
        navHome: 'Utama', navNews: 'Berita', navPost: 'Iklan', navMap: 'Peta', navBiz: 'Peniaga',
        topics: [
          {
            id: 'my',
            label: '🇲🇾 Malaysia',
            feeds: [
              { name: 'Astro Awani', url: 'https://rss.astroawani.com/rss/national/public' },
              { name: 'FMT Bahasa', url: 'https://www.freemalaysiatoday.com/category/bahasa/feed/' }
            ]
          },
          {
            id: 'sg',
            label: '🇸🇬 Singapura',
            feeds: [
              { name: 'BERITA Mediacorp SG', url: 'https://berita.mediacorp.sg/rss/singapura' }
            ]
          },
          {
            id: 'finance',
            label: '📈 Ekonomi & Pelaburan',
            feeds: [
              { name: 'Astro Awani Bisnes', url: 'https://rss.astroawani.com/rss/business/public' }
            ]
          },
          {
            id: 'life',
            label: '🍜 Gaya Hidup',
            feeds: [
              { name: 'Astro Awani Gaya Hidup', url: 'https://rss.astroawani.com/rss/lifestyle/public' }
            ]
          },
          {
            id: 'world',
            label: '🌍 Dunia',
            feeds: [
              { name: 'Astro Awani Dunia', url: 'https://rss.astroawani.com/rss/international/public' }
            ]
          }
        ]
      }
    };

    let currentNewsLang = localStorage.getItem('dama_lang') || 'zh';
    let currentTopicId = 'my';

    function switchNewsLang(lang) {
      currentNewsLang = lang;
      localStorage.setItem('dama_lang', lang);
      ['zh', 'en', 'ms'].forEach(l => {
        const btn = document.getElementById(`nLang-${l}`);
        btn.className = l === lang
          ? 'px-2 py-0.5 rounded-full bg-white text-red-600 transition'
          : 'px-2 py-0.5 rounded-full text-white/90 transition';
      });
      renderTopics();
      loadLiveNews();
    }

    function selectTopic(topicId) {
      currentTopicId = topicId;
      renderTopics();
      loadLiveNews();
    }

    function renderTopics() {
      const t = NEWS_I18N[currentNewsLang];
      document.getElementById('newsPageTitle').innerText = t.title;
      document.getElementById('newsPageSub').innerText = t.sub;
      document.getElementById('navHome').innerText = t.navHome;
      document.getElementById('navNews').innerText = t.navNews;
      document.getElementById('navPost').innerText = t.navPost;
      document.getElementById('navMap').innerText = t.navMap;
      document.getElementById('navBiz').innerText = t.navBiz;

      const tabsEl = document.getElementById('topicTabs');
      tabsEl.innerHTML = t.topics.map(tp => {
        const active = tp.id === currentTopicId;
        return `
          <button onclick="selectTopic('${tp.id}')"
                  class="px-3 py-1 rounded-full text-xs font-bold shrink-0 transition ${active ? 'bg-white text-red-600 shadow-xs' : 'bg-black/20 text-white/90 hover:bg-black/30'}">
            ${tp.label}
          </button>
        `;
      }).join('');
    }

    function timeAgo(dateStr, lang) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      const diffMins = Math.max(1, Math.floor((Date.now() - d.getTime()) / 60000));
      if (diffMins < 60) return lang === 'zh' ? `${diffMins}分钟前` : `${diffMins}m ago`;
      const hrs = Math.floor(diffMins / 60);
      if (hrs < 24) return lang === 'zh' ? `${hrs}小时前` : `${hrs}h ago`;
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    // 双通道引擎：通道1 rss2json -> 通道2 allorigins XML 直解析
    async function fetchSingleFeed(feedObj) {
      // 通道 1: rss2json
      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedObj.url)}`);
        const json = await res.json();
        if (json.status === 'ok' && Array.isArray(json.items) && json.items.length > 0) {
          return json.items.map(it => ({
            title: it.title,
            link: it.link,
            pubDate: it.pubDate,
            thumbnail: it.thumbnail || (it.enclosure && it.enclosure.link) || '',
            source: feedObj.name
          }));
        }
      } catch (e) {}

      // 通道 2: allorigins 代理 + 浏览器原生 DOMParser 解析 RSS XML
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(feedObj.url)}`);
        const data = await res.json();
        if (data && data.contents) {
          const xml = new DOMParser().parseFromString(data.contents, 'text/xml');
          const items = Array.from(xml.querySelectorAll('item'));
          return items.map(node => ({
            title: node.querySelector('title')?.textContent?.trim() || '',
            link: node.querySelector('link')?.textContent?.trim() || '',
            pubDate: node.querySelector('pubDate')?.textContent?.trim() || '',
            thumbnail: node.querySelector('enclosure')?.getAttribute('url') || '',
            source: feedObj.name
          })).filter(x => x.title && x.link);
        }
      } catch (e) {}

      return [];
    }

    async function loadLiveNews() {
      const t = NEWS_I18N[currentNewsLang];
      const topic = t.topics.find(item => item.id === currentTopicId) || t.topics[0];
      const box = document.getElementById('newsContainer');
      box.innerHTML = `<div class="text-center py-20 text-gray-400 text-sm animate-pulse">⏳ ${t.loading}</div>`;

      const results = await Promise.all(topic.feeds.map(f => fetchSingleFeed(f)));
      let allItems = results.flat();

      // 按发布时间倒序排列
      allItems.sort((a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));

      if (allItems.length === 0) {
        box.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center space-y-3 border border-gray-100">
            <div class="text-gray-400 text-sm">${t.empty}</div>
            <button onclick="loadLiveNews()" class="bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-full shadow-xs">${t.retry}</button>
          </div>
        `;
        return;
      }

      box.innerHTML = allItems.slice(0, 25).map((item, idx) => `
        <a href="${item.link}" target="_blank" rel="noopener noreferrer"
           class="block bg-white rounded-2xl p-3.5 shadow-2xs border border-gray-100 card-hover">
          <div class="flex justify-between gap-3">
            <div class="flex-1 min-w-0 flex flex-col justify-between">
              <div>
                <div class="flex items-center gap-1.5 mb-1.5">
                  ${idx < 3 ? `<span class="bg-red-600 text-white text-[10px] font-black px-1.5 py-0.2 rounded">HOT ${idx + 1}</span>` : ''}
                  <span class="bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded truncate max-w-[150px]">${item.source}</span>
                  <span class="text-[11px] text-gray-400 shrink-0">${timeAgo(item.pubDate, currentNewsLang)}</span>
                </div>
                <h2 class="font-bold text-gray-900 text-[15px] leading-snug line-clamp-2 mb-2">${item.title}</h2>
              </div>
              <div class="flex items-center justify-between text-[11px]">
                <span class="text-gray-400">${topic.label}</span>
                <span class="text-red-600 font-bold">${t.readMore}</span>
              </div>
            </div>
            ${item.thumbnail ? `<img src="${item.thumbnail}" onerror="this.style.display='none'" class="w-22 h-22 rounded-xl object-cover shrink-0 border border-gray-100" />` : ''}
          </div>
        </a>
      `).join('');
    }

    switchNewsLang(currentNewsLang);
  </script>
</body>
</html>
