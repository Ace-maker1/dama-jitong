    let currentNewsLang = localStorage.getItem('dama_lang') || 'zh';
    let currentTopicId = 'my';
    let activeRequestId = 0;

    function isSafeExternalUrl(url) {
      return /^https?:\/\//i.test((url || '').trim());
    }

    function fetchWithTimeout(url, ms = 7000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
    }

    function switchNewsLang(lang) {
      currentNewsLang = lang;
      localStorage.setItem('dama_lang', lang);
      ['zh', 'en', 'ms'].forEach(l => {
        const btn = document.getElementById(`nLang-${l}`);
        btn.className = l === lang
          ? 'px-2 py-0.5 rounded-full bg-white text-red-600 transition'
          : 'px-2 py-0.5 rounded-full text-white/90 transition';
      });
      renderTopics();
      loadLiveNews();
    }

    function selectTopic(topicId) {
      currentTopicId = topicId;
      renderTopics();
      loadLiveNews();
    }

    function renderTopics() {
      const t = NEWS_I18N[currentNewsLang];
      document.getElementById('backHomeLink').innerText = t.back;
      document.getElementById('newsPageTitle').innerText = t.title;
      document.getElementById('newsPageSub').innerText = t.sub;
      document.getElementById('syncBadge').innerText = t.syncing;
      document.getElementById('navHome').innerText = t.navHome;
      document.getElementById('navNews').innerText = t.navNews;
      document.getElementById('navPost').innerText = t.navPost;
      document.getElementById('navMap').innerText = t.navMap;
      document.getElementById('navBiz').innerText = t.navBiz;

      const tabsEl = document.getElementById('topicTabs');
      tabsEl.innerHTML = t.topics.map(tp => {
        const active = tp.id === currentTopicId;
        return `
          <button onclick="selectTopic('${tp.id}')"
                  class="px-3 py-1 rounded-full text-xs font-bold shrink-0 transition ${active ? 'bg-white text-red-600 shadow-xs' : 'bg-black/20 text-white/90 hover:bg-black/30'}">
            ${tp.label}
          </button>
        `;
      }).join('');
    }

    function timeAgo(dateStr, lang) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      const diffMins = Math.max(1, Math.floor((Date.now() - d.getTime()) / 60000));
      if (diffMins < 60) return lang === 'zh' ? `${diffMins}分钟前` : `${diffMins}m ago`;
      const hrs = Math.floor(diffMins / 60);
      if (hrs < 24) return lang === 'zh' ? `${hrs}小时前` : `${hrs}h ago`;
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function renderSkeleton() {
      return Array(5).fill(0).map(() => `
        <div class="bg-white rounded-2xl p-3.5 border border-gray-100 animate-pulse space-y-2.5">
          <div class="flex gap-2">
            <div class="h-4 w-16 bg-gray-200 rounded"></div>
            <div class="h-4 w-12 bg-gray-100 rounded"></div>
          </div>
          <div class="h-4 w-full bg-gray-200 rounded"></div>
          <div class="h-4 w-3/4 bg-gray-200 rounded"></div>
        </div>
      `).join('');
    }

    function renderNewsCards(items, topicLabel, readMoreText) {
      const seen = new Set();
      const uniqueItems = items.filter(it => {
        if (!isSafeExternalUrl(it.link)) return false;
        const key = it.title.slice(0, 18);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      return uniqueItems.slice(0, 25).map((item, idx) => `
        <a href="${item.link}" target="_blank" rel="noopener noreferrer"
           class="block bg-white rounded-2xl p-3.5 shadow-2xs border border-gray-100 card-hover">
          <div class="flex justify-between gap-3">
            <div class="flex-1 min-w-0 flex flex-col justify-between">
              <div>
                <div class="flex items-center gap-1.5 mb-1.5">
                  ${idx < 3 ? `<span class="bg-red-600 text-white text-[10px] font-black px-1.5 py-0.2 rounded">HOT ${idx + 1}</span>` : ''}
                  <span class="bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded truncate max-w-[160px]">${item.realSource || item.source}</span>
                  <span class="text-[11px] text-gray-400 shrink-0">${timeAgo(item.pubDate, currentNewsLang)}</span>
                </div>
                <h2 class="font-bold text-gray-900 text-[15px] leading-snug line-clamp-2 mb-2">${item.title}</h2>
              </div>
              <div class="flex items-center justify-between text-[11px]">
                <span class="text-gray-400">${topicLabel}</span>
                <span class="text-red-600 font-bold">${readMoreText}</span>
              </div>
            </div>
            ${item.thumbnail ? `<img src="${item.thumbnail}" loading="lazy" onerror="this.style.display='none'" class="w-20 h-20 rounded-xl object-cover shrink-0 border border-gray-100" />` : ''}
          </div>
        </a>
      `).join('');
    }

    async function fetchFeedFast(feedObj) {
      try {
        const res = await fetchWithTimeout(`/api/news?url=${encodeURIComponent(feedObj.url)}`, 7000);
        if (!res.ok) return [];
        const text = await res.text();
        const xml = new DOMParser().parseFromString(text, 'text/xml');
        return Array.from(xml.querySelectorAll('item')).map(node => {
          const rawTitle = node.querySelector('title')?.textContent?.trim() || '';
          const parts = rawTitle.split(' - ');
          const realMedia = parts.length > 1 ? parts[parts.length - 1].trim() : '';
          const cleanTitle = parts.length > 1 ? parts.slice(0, -1).join(' - ') : rawTitle;

          let media = node.getElementsByTagName('media:content')[0]?.getAttribute('url')
                   || node.getElementsByTagName('media:thumbnail')[0]?.getAttribute('url')
                   || node.querySelector('enclosure')?.getAttribute('url') || '';

          if (!media) {
            const descHtml = node.querySelector('description')?.textContent
                          || node.getElementsByTagName('content:encoded')[0]?.textContent || '';
            const imgMatch = descHtml.match(/<img[^>]+src=["']([^"']+)["']/i);
            if (imgMatch && imgMatch[1] && !imgMatch[1].includes('google.com')) {
              media = imgMatch[1];
            }
          }

          if (!media && cleanTitle) {
            media = `https://tse2.mm.bing.net/th?q=${encodeURIComponent(cleanTitle.slice(0, 28))}&w=240&h=240&c=7&rs=1&p=0`;
          }

          return {
            title: cleanTitle,
            link: node.querySelector('link')?.textContent?.trim() || '',
            pubDate: node.querySelector('pubDate')?.textContent?.trim() || '',
            thumbnail: media,
            source: feedObj.name,
            realSource: realMedia || feedObj.name
          };
        }).filter(x => x.title && x.link);
      } catch (e) {
        return [];
      }
    }

    async function loadLiveNews() {
      const reqId = ++activeRequestId;
      const t = NEWS_I18N[currentNewsLang];
      const topic = t.topics.find(item => item.id === currentTopicId) || t.topics[0];
      const box = document.getElementById('newsContainer');
      const syncBadge = document.getElementById('syncBadge');
      const cacheKey = `dmjt_v5_news_${currentNewsLang}_${topic.id}`;

      let hasCache = false;
      try {
        const cachedRaw = localStorage.getItem(cacheKey);
        if (cachedRaw) {
          const cachedItems = JSON.parse(cachedRaw);
          if (Array.isArray(cachedItems) && cachedItems.length > 0) {
            box.innerHTML = renderNewsCards(cachedItems, topic.label, t.readMore);
            hasCache = true;
          }
        }
      } catch (e) {}

      if (!hasCache) {
        box.innerHTML = renderSkeleton();
      }
      syncBadge.classList.remove('hidden');

      let collected = [];
      await Promise.all(topic.feeds.map(async (feed) => {
        const list = await fetchFeedFast(feed);
        if (reqId !== activeRequestId || list.length === 0) return;

        collected = collected.concat(list);
        collected.sort((a, b) => {
          const hasImgA = a.thumbnail ? 1 : 0;
          const hasImgB = b.thumbnail ? 1 : 0;
          if (hasImgB !== hasImgA) return hasImgB - hasImgA;
          return new Date(b.pubDate || 0) - new Date(a.pubDate || 0);
        });

        box.innerHTML = renderNewsCards(collected, topic.label, t.readMore);
        try {
          localStorage.setItem(cacheKey, JSON.stringify(collected.slice(0, 25)));
        } catch (e) {}
      }));

      if (reqId !== activeRequestId) return;
      syncBadge.classList.add('hidden');

      if (collected.length === 0 && !hasCache) {
        box.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center space-y-3 border border-gray-100">
            <div class="text-gray-400 text-sm">${t.empty}</div>
            <button onclick="loadLiveNews()" class="bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-full shadow-xs">${t.retry}</button>
          </div>
        `;
      }
    }

    switchNewsLang(currentNewsLang);
  </script>
</body>
</html>
