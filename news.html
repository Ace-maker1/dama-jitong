  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="app-shell">
    <!-- 顶部品牌栏与三语切换 -->
    <header class="bg-gradient-to-r from-red-600 via-red-600 to-orange-600 text-white px-3.5 py-3 shadow-md sticky top-0 z-30">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <a href="/index.html" id="backBtn" class="bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-xl text-xs font-bold shrink-0 transition">← 首页</a>
          <div class="min-w-0">
            <h1 id="pageTitle" class="font-black text-sm sm:text-base truncate">大马吉通 · 实时资讯快讯</h1>
            <p id="pageSub" class="text-[10px] text-red-100 truncate">全马本地 · 体育 · 加密货币 · 股市 · 地缘政治</p>
          </div>
        </div>
        <div class="flex items-center gap-1 bg-black/20 p-1 rounded-full text-[11px] font-bold shrink-0">
          <button onclick="setLang('zh')" id="btn-zh" class="lang-pill bg-white text-red-600 px-2 py-0.5 rounded-full transition">CN</button>
          <button onclick="setLang('en')" id="btn-en" class="lang-pill text-white/90 px-2 py-0.5 rounded-full transition">EN</button>
          <button onclick="setLang('ms')" id="btn-ms" class="lang-pill text-white/90 px-2 py-0.5 rounded-full transition">BM</button>
        </div>
      </div>

      <!-- 频道分类导航栏（可横向滑动） -->
      <div id="categoryTabs" class="mt-2.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5 text-xs font-bold"></div>
    </header>

    <!-- 状态提示与手动刷新栏 -->
    <div class="bg-white border-b border-slate-200 px-3.5 py-2 flex items-center justify-between text-[11px] text-slate-500">
      <span id="feedStatusText">⏳ 正在同步最新实时资讯...</span>
      <button onclick="loadCurrentCategory(true)" id="refreshBtn" class="text-red-600 font-bold hover:underline shrink-0">🔄 立即刷新</button>
    </div>

    <!-- 新闻列表主容器 -->
    <main id="newsContainer" class="p-3 space-y-2.5 flex-1">
      <div class="bg-white rounded-2xl p-6 text-center text-xs text-slate-400 shadow-xs">正在加载实时新闻流...</div>
    </main>

    <!-- 底部常驻导航栏 -->
    <nav class="fixed bottom-0 inset-x-0 max-w-[28rem] mx-auto bg-white border-t border-slate-200 py-2 px-6 flex justify-around items-center z-30 text-xs bottom-safe-bar">
      <a href="/index.html" class="flex flex-col items-center text-slate-500 hover:text-red-600">
        <span class="text-lg">🏠</span>
        <span id="navHome">分类首页</span>
      </a>
      <a href="/news.html" class="flex flex-col items-center text-red-600 font-bold">
        <span class="text-lg">📰</span>
        <span id="navNews">实时新闻</span>
      </a>
      <a href="/map.html" class="flex flex-col items-center text-slate-500 hover:text-emerald-600">
        <span class="text-lg">🧭</span>
        <span id="navMap">站内导航</span>
      </a>
    </nav>
  </div>

  <script>

        navHome: 'Home',
        navNews: 'Live News',
        navMap: 'Navigation',
        cats: {
          my: '🇲🇾 Malaysia',
          crypto: '₿ Crypto',
          stocks: '📈 Stocks & Markets',

          sports: '⚽ Sports',
          penang: '🏝️ Penang',

      },
      ms: {
        back: '← Utama',
        title: 'DamaJitong · Berita Terkini',
        sub: 'Malaysia · Sukan · Kripto · Saham · Geopolitik',
        refresh: '🔄 Muat Semula',
        loading: '⏳ Memuatkan berita terkini...',
        updated: (n) => `✅ ${n} berita terkini dikemas kini`,
        empty: 'Tiada berita ditemui. Tekan Muat Semula.',
        readMore: 'Baca Penuh ↗',
        navHome: 'Utama',
        navNews: 'Berita',

        cats: {
          my: '🇲🇾 Utama MY',
          crypto: '₿ Kripto',
          stocks: '📈 Saham & Pasaran',
          geopolitics: '🌐 Geopolitik',

          kl: '🏙️ KL & Selangor'
        }
      }
    };

    // 三语言 × 7 大高频实时 RSS 源配置（支持每几分钟实时刷新，单次返回 20~40 条）
    const RSS_SOURCES = {
      zh: {
        my: [
          { name: 'Google 新闻 · 马来西亚', url: 'https://news.google.com/rss/search?q=%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A+when:12h&hl=zh-CN&gl=MY&ceid=MY:zh-Hans' },
          { name: '光华日报', url: 'https://kwongwah.com.my/feed/' }
        ],
        crypto: [
          { name: 'Google 快讯 · 加密货币', url: 'https://news.google.com/rss/search?q=(%E6%AF%94%E7%89%B9%E5%B8%81+OR+%E4%BB%A5%E5%A4%AA%E5%9D%8A+OR+%E5%8A%A0%E5%AF%86%E8%B4%A7%E5%B8%81+OR+Bitcoin+OR+Crypto)+when:12h&hl=zh-CN&gl=SG&ceid=SG:zh-Hans' },
          { name: 'Cointelegraph (实时英文快讯)', url: 'https://cointelegraph.com/rss' }
        ],
        stocks: [
          { name: 'Google 财经 · 美股/亚股/马股', url: 'https://news.google.com/rss/search?q=(%E7%BE%8E%E8%82%A1+OR+%E7%BA%B3%E6%8C%87+OR+%E9%A9%AC%E8%82%A1+OR+%E8%82%A1%E5%B8%82+OR+%E8%8B%B1%E4%BC%9F%E8%BE%BE)+when:12h&hl=zh-CN&gl=SG&ceid=SG:zh-Hans' }
        ],
        geopolitics: [
          { name: 'Google 国际 · 地缘政治', url: 'https://news.google.com/rss/search?q=(%E5%9C%B0%E7%BC%98%E6%94%BF%E6%B2%BB+OR+%E4%B8%AD%E4%B8%9C+OR+%E7%BE%8E%E5%9B%BD+OR+%E5%85%B3%E7%A8%8E+OR+%E5%9B%BD%E9%99%85%E5%B1%80%E5%8A%BF)+when:12h&hl=zh-CN&gl=SG&ceid=SG:zh-Hans' },
          { name: 'RTHK 国际新闻', url: 'https://rthk.hk/rthk/news/rss/c_expressnews_cinternational.xml' }
        ],
        sports: [
          { name: 'Google 体育 · 英超/欧冠/羽球/NBA', url: 'https://news.google.com/rss/search?q=(%E8%8B%B1%E8%B6%85+OR+%E6%AC%A7%E5%86%A0+OR+NBA+OR+%E7%BE%BD%E6%AF%9B%E7%90%83+OR+%E4%B8%96%E7%95%8C%E6%9D%AF+OR+UFC)+when:12h&hl=zh-CN&gl=SG&ceid=SG:zh-Hans' },
          { name: 'RTHK 体育快讯', url: 'https://rthk.hk/rthk/news/rss/c_expressnews_csport.xml' }
        ],
        penang: [
          { name: 'Google 新闻 · 槟城', url: 'https://news.google.com/rss/search?q=%E6%A7%9F%E5%9F%8E+when:24h&hl=zh-CN&gl=MY&ceid=MY:zh-Hans' }
        ],
        kl: [
          { name: 'Google 新闻 · 吉隆坡/雪兰莪', url: 'https://news.google.com/rss/search?q=(%E5%90%89%E9%9A%86%E5%9D%A1+OR+%E9%9B%AA%E5%85%B0%E8%8E%AA)+when:24h&hl=zh-CN&gl=MY&ceid=MY:zh-Hans' }
        ]
      },
      en: {
        my: [
          { name: 'Free Malaysia Today', url: 'https://www.freemalaysiatoday.com/feed/' },
          { name: 'Malay Mail', url: 'https://www.malaymail.com/feed/rss/malaysia' }
        ],
        crypto: [
          { name: 'Cointelegraph Live', url: 'https://cointelegraph.com/rss' },
          { name: 'Google News · Crypto & Bitcoin', url: 'https://news.google.com/rss/search?q=(Bitcoin+OR+Ethereum+OR+Solana+OR+Crypto)+when:6h&hl=en-US&gl=US&ceid=US:en' }
        ],
        stocks: [
          { name: 'Yahoo Finance · Markets', url: 'https://finance.yahoo.com/news/rssindex' },
          { name: 'Google News · Wall St & Bursa', url: 'https://news.google.com/rss/search?q=(stock+market+OR+Nasdaq+OR+S%26P+500+OR+Bursa+Malaysia)+when:6h&hl=en-US&gl=US&ceid=US:en' }
        ],
        geopolitics: [
          { name: 'BBC World News', url: 'https://feeds.bbci.co.uk/news/world/rss.xml' },
          { name: 'Channel NewsAsia · World', url: 'https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml&category=6511' }
        ],
        sports: [
          { name: 'BBC Sport Live', url: 'https://feeds.bbci.co.uk/sport/rss.xml' },
          { name: 'Google News · Football & UFC', url: 'https://news.google.com/rss/search?q=(Premier+League+OR+Champions+League+OR+UFC+OR+Badminton+Malaysia)+when:6h&hl=en-MY&gl=MY&ceid=MY:en' }
        ],
        penang: [
          { name: 'Google News · Penang', url: 'https://news.google.com/rss/search?q=Penang+when:24h&hl=en-MY&gl=MY&ceid=MY:en' }
        ],
        kl: [
          { name: 'Google News · Kuala Lumpur', url: 'https://news.google.com/rss/search?q=(Kuala+Lumpur+OR+Selangor)+when:24h&hl=en-MY&gl=MY&ceid=MY:en' }
        ]
      },
      ms: {
        my: [
          { name: 'Google Berita · Malaysia', url: 'https://news.google.com/rss/search?q=Malaysia+when:12h&hl=ms&gl=MY&ceid=MY:ms' }
        ],
        crypto: [
          { name: 'Google Berita · Kripto & Bitcoin', url: 'https://news.google.com/rss/search?q=(Kripto+OR+Bitcoin+OR+Ethereum+OR+Mata+Wang+Kripto)+when:24h&hl=ms&gl=MY&ceid=MY:ms' },
          { name: 'Cointelegraph Live', url: 'https://cointelegraph.com/rss' }
        ],
        stocks: [
          { name: 'Google Berita · Bursa & Saham', url: 'https://news.google.com/rss/search?q=(Bursa+Malaysia+OR+saham+OR+ekonomi+OR+pasaran+kewangan)+when:12h&hl=ms&gl=MY&ceid=MY:ms' }
        ],
        geopolitics: [
          { name: 'Google Berita · Geopolitik & Dunia', url: 'https://news.google.com/rss/search?q=(geopolitik+OR+berita+dunia+OR+Timur+Tengah+OR+Amerika+Syarikat)+when:12h&hl=ms&gl=MY&ceid=MY:ms' }
        ],
        sports: [
          { name: 'Google Berita · Sukan & Bola Sepak', url: 'https://news.google.com/rss/search?q=(sukan+OR+Liga+Perdana+OR+badminton+Malaysia+OR+Harimau+Malaya)+when:12h&hl=ms&gl=MY&ceid=MY:ms' }
        ],
        penang: [
          { name: 'Google Berita · Pulau Pinang', url: 'https://news.google.com/rss/search?q=Pulau+Pinang+when:24h&hl=ms&gl=MY&ceid=MY:ms' }
        ],
        kl: [
          { name: 'Google Berita · Kuala Lumpur', url: 'https://news.google.com/rss/search?q=(Kuala+Lumpur+OR+Selangor)+when:24h&hl=ms&gl=MY&ceid=MY:ms' }
        ]
      }
    };

    let currentLang = localStorage.getItem('dama_lang') || 'zh';
    let currentCat = 'my';
    const feedCache = {};

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('dama_lang', lang);
      document.querySelectorAll('.lang-pill').forEach(btn => {
        btn.classList.remove('bg-white', 'text-red-600');
        btn.classList.add('text-white/90');
      });
      const active = document.getElementById(`btn-${lang}`);
      if (active) {
        active.classList.add('bg-white', 'text-red-600');
        active.classList.remove('text-white/90');
      }

      const t = UI_TEXT[lang];
      document.getElementById('backBtn').innerText = t.back;
      document.getElementById('pageTitle').innerText = t.title;
      document.getElementById('pageSub').innerText = t.sub;
      document.getElementById('refreshBtn').innerText = t.refresh;
      document.getElementById('navHome').innerText = t.navHome;
      document.getElementById('navNews').innerText = t.navNews;
      document.getElementById('navMap').innerText = t.navMap;

      renderCategoryTabs();
      loadCurrentCategory(false);
    }

    function renderCategoryTabs() {
      const cats = UI_TEXT[currentLang].cats;
      const wrap = document.getElementById('categoryTabs');
      wrap.innerHTML = Object.entries(cats).map(([key, label]) => {
        const isActive = key === currentCat;
        const cls = isActive
          ? 'bg-white text-red-600 shadow-xs'
          : 'bg-white/15 text-white hover:bg-white/25';
        return `<button onclick="selectCategory('${key}')" class="${cls} px-3 py-1.5 rounded-full shrink-0 transition">${label}</button>`;
      }).join('');
    }

    function selectCategory(catKey) {
      currentCat = catKey;
      renderCategoryTabs();
      loadCurrentCategory(false);
    }

    function formatRelativeTime(pubDateStr) {
      if (!pubDateStr) return '';
      const d = new Date(pubDateStr);
      if (Number.isNaN(d.getTime())) return pubDateStr;
      const diffMins = Math.max(1, Math.floor((Date.now() - d.getTime()) / 60000));
      if (diffMins < 60) {
        return currentLang === 'zh' ? `${diffMins} 分钟前` : (currentLang === 'ms' ? `${diffMins} min lalu` : `${diffMins}m ago`);
      }
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) {
        return currentLang === 'zh' ? `${diffHours} 小时前` : (currentLang === 'ms' ? `${diffHours} jam lalu` : `${diffHours}h ago`);
      }
      return d.toLocaleDateString();
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html || '';
      return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
    }

    async function fetchSingleFeed(source) {
      try {
        const res = await fetch(`/api/news?url=${encodeURIComponent(source.url)}`);
        if (!res.ok) return [];
        const xmlText = await res.text();
        const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
        const items = Array.from(doc.querySelectorAll('item')).slice(0, 25);

        return items.map(item => {
          const title = (item.querySelector('title')?.textContent || '').trim();
          const link = (item.querySelector('link')?.textContent || '').trim();
          const pubDate = (item.querySelector('pubDate')?.textContent || '').trim();
          const descRaw = item.querySelector('description')?.textContent || '';
          const sourceTag = item.querySelector('source')?.textContent || source.name;
          const ts = pubDate ? new Date(pubDate).getTime() : 0;

          return {
            title,
            link,
            pubDate,
            ts: Number.isNaN(ts) ? 0 : ts,
            summary: stripHtml(descRaw).slice(0, 140),
            source: sourceTag.trim() || source.name
          };
        }).filter(x => x.title && x.link);
      } catch (e) {
        return [];
      }
    }

    async function loadCurrentCategory(forceRefresh = false) {
      const t = UI_TEXT[currentLang];
      const statusEl = document.getElementById('feedStatusText');
      const container = document.getElementById('newsContainer');
      const cacheKey = `${currentLang}_${currentCat}`;

      if (!forceRefresh && feedCache[cacheKey] && (Date.now() - feedCache[cacheKey].time < 180000)) {
        renderNewsList(feedCache[cacheKey].items);
        statusEl.innerText = t.updated(feedCache[cacheKey].items.length);
        return;
      }

      statusEl.innerText = t.loading;
      const sources = (RSS_SOURCES[currentLang] && RSS_SOURCES[currentLang][currentCat]) || [];
      const results = await Promise.all(sources.map(s => fetchSingleFeed(s)));
      const merged = results.flat();

      // 去重并按最新发布时间倒序排列
      const seen = new Set();
      const deduped = [];
      merged.sort((a, b) => b.ts - a.ts).forEach(item => {
        const normTitle = item.title.toLowerCase().slice(0, 32);
        if (!seen.has(normTitle)) {
          seen.add(normTitle);
          deduped.push(item);
        }
      });

      const finalItems = deduped.slice(0, 35);
      feedCache[cacheKey] = { time: Date.now(), items: finalItems };

      if (finalItems.length === 0) {
        statusEl.innerText = t.empty;
        container.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center text-xs text-slate-400 shadow-xs">${t.empty}</div>`;
        return;
      }

      statusEl.innerText = t.updated(finalItems.length);
      renderNewsList(finalItems);
    }

    function renderNewsList(items) {
      const t = UI_TEXT[currentLang];
      const container = document.getElementById('newsContainer');
      container.innerHTML = items.map(item => `
        <a href="${item.link}" target="_blank" rel="noopener noreferrer"
           class="block bg-white rounded-2xl p-3.5 shadow-xs border border-slate-200/80 card-hover transition">
          <div class="flex items-center justify-between gap-2 text-[10px] mb-1.5">
            <span class="font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded-full truncate max-w-[180px]">${item.source}</span>
            <span class="text-slate-400 shrink-0">${formatRelativeTime(item.pubDate)}</span>
          </div>
          <h2 class="text-sm font-bold text-slate-900 leading-snug mb-1.5">${item.title}</h2>
          ${item.summary && item.summary !== item.title ? `<p class="text-xs text-slate-500 line-clamp-2 leading-relaxed mb-2">${item.summary}</p>` : ''}
          <div class="text-right text-[11px] font-bold text-red-600">${t.readMore}</div>
        </a>
      `).join('');
    }

    setLang(currentLang);
  </script>
</body>
